<title>Simulador Becarios SMCV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single study column (max 920px) under a sticky tab bar; exam screens use a question card + side navigator grid that stacks on phones. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --sunken:#E3E9E6; --ink:#17201E; --muted:#5A6865; --line:#CFD8D4;
  --accent:#0C7564; --accent-soft:#D5EBE5; --accent-ink:#FFFFFF; --copper:#A9572A; --copper-soft:#F3E2D6;
  --good:#1D7F47; --good-soft:#DCF0E3; --bad:#B83A26; --bad-soft:#F7DFDA; --warn:#94650F; --warn-soft:#F5EAD2;
  --fig-a:#CFE3DD; --fig-b:#86B3A8;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1413; --surface:#162020; --sunken:#111918; --ink:#E4ECEA; --muted:#93A4A0; --line:#2A3735;
  --accent:#43C2A9; --accent-soft:#163A33; --accent-ink:#04201A; --copper:#E39565; --copper-soft:#3A2519;
  --good:#5BCB8A; --good-soft:#17331F; --bad:#F08571; --bad-soft:#3D1D17; --warn:#E5B862; --warn-soft:#382B12;
  --fig-a:#2B4A44; --fig-b:#55887C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1413; --surface:#162020; --sunken:#111918; --ink:#E4ECEA; --muted:#93A4A0; --line:#2A3735;
  --accent:#43C2A9; --accent-soft:#163A33; --accent-ink:#04201A; --copper:#E39565; --copper-soft:#3A2519;
  --good:#5BCB8A; --good-soft:#17331F; --bad:#F08571; --bad-soft:#3D1D17; --warn:#E5B862; --warn-soft:#382B12;
  --fig-a:#2B4A44; --fig-b:#55887C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,3rem)} h2{font-size:1.75rem} h3{font-size:1.3rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header + tabs */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.02em}
.brand span{color:var(--copper);font-family:var(--f-mono);font-size:.8rem}
.clocks{display:flex;gap:8px;flex-wrap:wrap}
.clock{display:flex;flex-direction:column;padding:6px 10px;border-radius:8px;background:var(--sunken);min-width:150px}
.clock small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.clock .mono{font-size:.95rem}
.clock.urgent{background:var(--copper-soft)} .clock.urgent .mono{color:var(--copper)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
nav.tabs button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
main{padding-block:24px 64px}
.stack{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid2>*{min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none}
.btn.small{padding:6px 10px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--sunken);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.cop{background:var(--copper-soft);color:var(--copper)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}

/* hero */
.hero{display:grid;gap:14px}
.hero p.lead{font-size:1.1rem;max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fact{border-left:3px solid var(--copper);padding:4px 0 4px 12px}
.fact b{display:block;font-family:var(--f-display);font-size:1.2rem}
.fact span{color:var(--muted);font-size:.92rem}

/* plan */
.plan{display:grid;gap:18px}
.day h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.day h3 small{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.check label{cursor:pointer}
.check.done label{color:var(--muted);text-decoration:line-through}
.check .tag{margin-left:6px}

/* progress bars */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:.92rem}
.bar .track{height:10px;border-radius:999px;background:var(--sunken);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:999px}
.bar .fill.low{background:var(--copper)}
@media (max-width:520px){.bar{grid-template-columns:100px 1fr 56px}}

/* config */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;font-weight:600;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:grid;gap:6px}
.field>span{font-weight:700;font-size:.9rem}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:start}
@media (max-width:780px){.exam{grid-template-columns:minmax(0,1fr)}}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.timer{font-family:var(--f-mono);font-size:1.25rem;padding:4px 12px;border-radius:8px;background:var(--sunken)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qtext{font-size:1.08rem;display:grid;gap:10px;min-width:0}
.qtext table{border-collapse:collapse;font-size:.95rem;font-variant-numeric:tabular-nums}
.qtext th,.qtext td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.qtext th{background:var(--sunken)}
.tablebox{overflow-x:auto}
.qtext code,.opt code,.expl code{font-family:var(--f-mono);font-size:.9em;background:var(--sunken);padding:1px 5px;border-radius:4px}
.figure{display:flex;justify-content:center;padding:12px;background:var(--sunken);border-radius:8px;color:var(--ink)}
.figure svg{width:100%;max-width:340px;height:auto;max-height:260px}
.opts{display:grid;gap:8px;margin-top:16px}
.opts.figs{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);padding:11px 14px;border-radius:9px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .key{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--sunken);font-family:var(--f-mono);font-size:.85rem}
.opt .body{min-width:0;flex:1}
.opts.figs .opt{flex-direction:column;align-items:center}
.opt svg{width:100%;max-width:130px;height:auto;color:var(--ink)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.expl{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--sunken);border-left:3px solid var(--accent)}
.expl.bad{border-left-color:var(--bad)}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:18px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.navgrid button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;font-family:var(--f-mono);font-size:.82rem}
.navgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.mark{box-shadow:inset 0 -3px 0 var(--copper)}
.navgrid button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:grid;gap:4px;font-size:.82rem;color:var(--muted);margin-top:10px}
.pace{font-size:.85rem;color:var(--muted)}
.confirm{margin-top:12px;padding:12px;border-radius:8px;background:var(--warn-soft);display:grid;gap:10px}

/* results */
.score{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end}
.score .big{font-family:var(--f-display);font-size:4rem;line-height:1}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl td.n{text-align:right}
details.rev{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface)}
details.rev summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.rev[open]{padding-bottom:14px}

/* likert */
.lik{display:grid;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.lik:last-child{border-bottom:0}
.lik .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lik .scale button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px;font-size:.78rem;line-height:1.2}
.lik .scale button b{display:block;font-family:var(--f-mono);font-size:1rem}
.lik .scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* guide */
.guide h3{margin-bottom:8px}
.guide ul,.guide ol{margin:6px 0 0;padding-left:20px;display:grid;gap:6px}
.kbd{font-family:var(--f-mono);font-size:.82rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
.breath{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.lung{width:120px;height:120px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;color:var(--accent);transition:transform 4s ease-in-out;flex:none}
.lung.in{transform:scale(1.35)}
@media (prefers-reduced-motion:reduce){.lung{transition:none}}
.empty{padding:30px;text-align:center;color:var(--muted)}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>Simulador Becarios SMCV</b><span>Cu · 2027</span></div>
    <div class="clocks" id="clocks"></div>
  </div>
</header>
<nav class="tabs" aria-label="Secciones">
  <div class="wrap" id="tabs">
    <button data-tab="inicio">Inicio y plan</button>
    <button data-tab="practica">Práctica por área</button>
    <button data-tab="simulacro">Simulacro de aptitudes</button>
    <button data-tab="competencias">Competencias</button>
    <button data-tab="guia">Guía y entrevista</button>
  </div>
</nav>
<main class="wrap" id="view"></main>

"activo", "negligente", "atento"], "answer": 3, "explanation": "Diligente es quien actúa con cuidado y prontitud; lo contrario es negligente."}, {"id": "v08", "area": "verbal", "subtype": "antonimos", "difficulty": "facil", "prompt": "Señale el antónimo de <b>AUMENTAR<\/b>.", "options": ["ampliar", "crecer", "reducir", "elevar", "acrecentar"], "answer": 2, "explanation": "Aumentar es hacer mayor algo; su opuesto es reducir. Las demás son sinónimos."}, {"id": "v09", "area": "verbal", "subtype": "antonimos", "difficulty": "media", "prompt": "Señale el antónimo de <b>INOCUO<\/b>.", "options": ["inofensivo", "leve", "nocivo", "benigno", "sano"], "answer": 2, "explanation": "Inocuo significa que no hace daño; su antónimo es nocivo."}, {"id": "v10", "area": "verbal", "subtype": "antonimos", "difficulty": "dificil", "prompt": "Señale el antónimo de <b>PRÓDIGO<\/b>.", "options": ["mezquino", "generoso", "dadivoso", "derrochador", "espléndido"], "answer": 0, "explanation": "Pródigo es quien gasta o da sin medida; lo opuesto es mezquino (tacaño)."}, {"id": "v11", "area": "verbal", "subtype": "analogias", "difficulty": "facil", "prompt": "<b>CASCO : CABEZA ::<\/b>", "options": ["guantes : manos", "lentes : montura", "botas : suela", "chaleco : bolsillo", "overol : tela"], "answer": 0, "explanation": "El casco protege la cabeza, así como los guantes protegen las manos (relación protector–parte del cuerpo)."}, {"id": "v12", "area": "verbal", "subtype": "analogias", "difficulty": "facil", "prompt": "<b>MINERAL : CONCENTRADORA ::<\/b>", "options": ["harina : pan", "trigo : molino", "leche : vaca", "agua : río", "madera : bosque"], "answer": 1, "explanation": "El mineral es la materia prima que se procesa en la concentradora, como el trigo se procesa en el molino."}, {"id": "v13", "area": "verbal", "subtype": "analogias", "difficulty": "media", "prompt": "<b>TERMÓMETRO : TEMPERATURA ::<\/b>", "options": ["martillo : clavo", "reloj : pulsera", "regla : madera", "manómetro : presión", "microscopio : laboratorio"], "answer": 3, "explanation": "El termómetro mide la temperatura; el manómetro mide la presión (instrumento–magnitud que mide)."}, {"id": "v14", "area": "verbal", "subtype": "analogias", "difficulty": "media", "prompt": "<b>SEQUÍA : AGUA ::<\/b>", "options": ["inundación : lluvia", "hambruna : alimento", "incendio : fuego", "frío : invierno", "oscuridad : noche"], "answer": 1, "explanation": "La sequía es la carencia de agua, así como la hambruna es la carencia de alimento."}, {"id": "v15", "area": "verbal", "subtype": "analogias", "difficulty": "dificil", "prompt": "<b>ESCORIA : FUNDICIÓN ::<\/b>", "options": ["acero : horno", "cobre : mina", "aserrín : carpintería", "pan : panadería", "vino : bodega"], "answer": 2, "explanation": "La escoria es el residuo que deja la fundición, como el aserrín es el residuo del trabajo de carpintería."}, {"id": "v16", "area": "verbal", "subtype": "analogias", "difficulty": "dificil", "prompt": "<b>ARQUITECTO : PLANO ::<\/b>", "options": ["pintor : pincel", "médico : hospital", "escritor : editorial", "cocinero : cocina", "compositor : partitura"], "answer": 4, "explanation": "El arquitecto elabora planos, el compositor elabora partituras (autor–documento que crea para plasmar su obra)."}, {"id": "v17", "area": "verbal", "subtype": "oraciones_incompletas", "difficulty": "facil", "prompt": "Antes de ingresar a la zona de voladura, todo trabajador debe esperar la ________ del supervisor.", "options": ["autorización", "reprimenda", "indiferencia", "ausencia", "renuncia"], "answer": 0, "explanation": "En un contexto de seguridad, el ingreso a una zona de riesgo requiere la autorización del supervisor."}, {"id": "v18", "area": "verbal", "subtype": "oraciones_incompletas", "difficulty": "media", "prompt": "El informe fue tan ________ que, en solo una página, resumió los hallazgos de seis meses de monitoreo.", "options": ["extenso", "ambiguo", "redundante", "conciso", "confuso"], "answer": 3, "explanation": "Resumir mucha información en una página indica brevedad y precisión, es decir, un informe conciso."}, {"id": "v19", "area": "verbal", "subtype": "oraciones_incompletas", "difficulty": "media", "prompt": "La empresa invirtió en una planta de tratamiento para ________ el consumo de agua fresca y ________ el agua de proceso.", "options": ["aumentar – desechar", "reducir – reutilizar", "duplicar – contaminar", "mantener – desperdiciar", "ignorar – reciclar"], "answer": 1, "explanation": "Una planta de tratamiento busca reducir el uso de agua fresca y reutilizar el agua de proceso; es la única pareja coherente."}, {"id": "v20", "area": "verbal", "subtype": "oraciones_incompletas", "difficulty": "facil", "prompt": "A pesar de las ________ condiciones climáticas, la cuadrilla terminó el mantenimiento a tiempo.", "options": ["adversas", "favorables", "óptimas", "ideales", "apacibles"], "answer": 0, "explanation": "«A pesar de» introduce una dificultad; solo «adversas» expresa condiciones desfavorables."}, {"id": "v21", "area": "verbal", "subtype": "oraciones_incompletas", "difficulty": "dificil", "prompt": "Si bien la nueva tecnología ________ los costos operativos, su implementación ________ una capacitación intensiva del personal, lo que ________ su adopción inmediata.", "options": ["incrementa – evita – facilita", "reduce – exige – dificulta", "reduce – elimina – acelera", "eleva – requiere – impide", "mantiene – omite – favorece"], "answer": 1, "explanation": "«Si bien» plantea una ventaja (reduce costos) frente a una desventaja (exige capacitación), que a su vez dificulta la adopción inmediata."}, {"id": "v22", "area": "verbal", "subtype": "conectores", "difficulty": "facil", "prompt": "El equipo no superó la inspección; ________, fue retirado de operación.", "options": ["por consiguiente", "sin embargo", "aunque", "además", "en cambio"], "answer": 0, "explanation": "El retiro del equipo es consecuencia de no superar la inspección, por lo que se requiere un conector consecutivo."}, {"id": "v23", "area": "verbal", "subtype": "conectores", "difficulty": "media", "prompt": "________ el yacimiento tiene baja ley, su gran volumen lo hace económicamente viable.", "options": ["Porque", "Si bien", "Dado que", "Por lo tanto", "Así que"], "answer": 1, "explanation": "Se oponen una desventaja (baja ley) y una ventaja (gran volumen); «si bien» es el conector concesivo adecuado."}, {"id": "v24", "area": "verbal", "subtype": "conectores", "difficulty": "media", "prompt": "Los trabajadores recibieron capacitación en primeros auxilios; ________, se les entregó un manual de procedimientos.", "options": ["no obstante", "por el contrario", "aunque", "asimismo", "o sea"], "answer": 3, "explanation": "La segunda acción se suma a la primera, por lo que corresponde un conector aditivo como «asimismo»."}, {"id": "v25", "area": "verbal", "subtype": "conectores", "difficulty": "dificil", "prompt": "La presa cumple los estándares internacionales; ________, se realizan monitoreos diarios, ________ cualquier anomalía pueda detectarse a tiempo.", "options": ["por lo tanto – aunque", "aun así – de modo que", "es decir – porque", "en cambio – sin que", "además – pero"], "answer": 1, "explanation": "«Aun así» indica que, pese a cumplir estándares, se sigue monitoreando; «de modo que» expresa la finalidad de detectar anomalías."}, {"id": "v26", "area": "verbal", "subtype": "termino_excluido", "difficulty": "facil", "prompt": "Señale el término que no guarda relación con los demás.", "options": ["cobre", "granito", "molibdeno", "plata", "oro"], "answer": 1, "explanation": "Cobre, molibdeno, plata y oro son metales; el granito es una roca."}, {"id": "v27", "area": "verbal", "subtype": "termino_excluido", "difficulty": "media", "prompt": "Señale el término que no guarda relación con los demás.", "options": ["precaución", "prudencia", "cautela", "cuidado", "temeridad"], "answer": 4, "explanation": "Todos los términos aluden a actuar con cuidado, excepto temeridad, que es exposición imprudente al peligro."}, {"id": "v28", "area": "verbal", "subtype": "termino_excluido", "difficulty": "dificil", "prompt": "Señale el término que no guarda relación con los demás.", "options": ["lóbrego", "sombrío", "tenebroso", "oscuro", "diáfano"], "answer": 4, "explanation": "Lóbrego, sombrío, tenebroso y oscuro aluden a falta de luz; diáfano significa claro o transparente."}, {"id": "v29", "area": "verbal", "subtype": "comprension_lectora", "difficulty": "media", "prompt": "<p><i>En las zonas áridas del sur peruano, el agua es un recurso que condiciona tanto la agricultura como la industria. Por ello, algunas operaciones mineras han optado por tratar aguas residuales urbanas y emplearlas en sus procesos, en lugar de captar agua de ríos que también abastecen a los agricultores. Este enfoque tiene un doble beneficio: reduce la presión sobre las fuentes naturales y mejora la calidad del agua que retorna al ambiente, pues antes esos efluentes se vertían sin tratamiento. No obstante, los especialistas advierten que estas soluciones requieren inversiones elevadas y un monitoreo permanente para asegurar que los parámetros de calidad se cumplan de manera sostenida.<\/i><\/p>¿Cuál es la idea principal del texto?", "options": ["El tratamiento de aguas residuales urbanas para uso minero alivia la presión sobre las fuentes naturales, aunque exige inversión y control constante.", "La agricultura es la principal consumidora de agua en el sur peruano.", "Las operaciones mineras están obligadas por ley a dejar de usar agua de ríos.", "Los efluentes urbanos no pueden ser tratados de manera eficaz.", "El monitoreo de la calidad del agua es innecesario si la inversión es alta."], "answer": 0, "explanation": "El texto presenta el uso de aguas residuales tratadas, sus beneficios y sus exigencias (inversión y monitoreo); las demás opciones son parciales o contradicen el texto."}, {"id": "v30", "area": "verbal", "subtype": "comprension_lectora", "difficulty": "dificil", "prompt": "<p><i>En las zonas áridas del sur peruano, el agua es un recurso que condiciona tanto la agricultura como la industria. Por ello, algunas operaciones mineras han optado por tratar aguas residuales urbanas y emplearlas en sus procesos, en lugar de captar agua de ríos que también abastecen a los agricultores. Este enfoque tiene un doble beneficio: reduce la presión sobre las fuentes naturales y mejora la calidad del agua que retorna al ambiente, pues antes esos efluentes se vertían sin tratamiento. No obstante, los especialistas advierten que estas soluciones requieren inversiones elevadas y un monitoreo permanente para asegurar que los parámetros de calidad se cumplan de manera sostenida.<\/i><\/p>Del texto se infiere que, antes de aplicarse este enfoque,", "options": ["la minería no requería agua para sus procesos.", "los agricultores utilizaban aguas residuales tratadas.", "los efluentes urbanos afectaban el ambiente al verterse sin tratamiento.", "los ríos de la zona tenían un caudal abundante.", "el monitoreo de la calidad del agua era permanente."], "answer": 2, "explanation": "El texto afirma que el enfoque «mejora la calidad del agua» porque antes los efluentes se vertían sin tratamiento, lo que implica un impacto ambiental previo."}, {"id": "v31", "area": "verbal", "subtype": "comprension_lectora", "difficulty": "facil", "prompt": "<p><i>La fatiga es uno de los factores de riesgo menos visibles en la operación de grandes camiones mineros. Un operador cansado puede tardar más en reaccionar o incluso quedarse dormido unos segundos, tiempo suficiente para provocar un accidente grave. Para enfrentar este problema, varias empresas han instalado sistemas que, mediante cámaras en la cabina, detectan el parpadeo prolongado o la inclinación de la cabeza y emiten alertas sonoras y vibraciones en el asiento. Sin embargo, la tecnología no sustituye la gestión adecuada de turnos ni el descanso efectivo. Los expertos coinciden en que el dispositivo es una barrera adicional, no la solución de fondo.<\/i><\/p>Según el texto, ¿cuál es la función de los sistemas instalados en la cabina?", "options": ["Controlar automáticamente la velocidad del camión.", "Reemplazar al operador en los turnos nocturnos.", "Detectar signos de somnolencia y alertar al operador.", "Programar los turnos de trabajo del personal.", "Grabar los accidentes para su posterior investigación."], "answer": 2, "explanation": "El texto indica que las cámaras detectan parpadeo prolongado o inclinación de la cabeza y emiten alertas sonoras y vibraciones."}, {"id": "v32", "area": "verbal", "subtype": "comprension_lectora", "difficulty": "media", "prompt": "<p><i>La fatiga es uno de los factores de riesgo menos visibles en la operación de grandes camiones mineros. Un operador cansado puede tardar más en reaccionar o incluso quedarse dormido unos segundos, tiempo suficiente para provocar un accidente grave. Para enfrentar este problema, varias empresas han instalado sistemas que, mediante cámaras en la cabina, detectan el parpadeo prolongado o la inclinación de la cabeza y emiten alertas sonoras y vibraciones en el asiento. Sin embargo, la tecnología no sustituye la gestión adecuada de turnos ni el descanso efectivo. Los expertos coinciden en que el dispositivo es una barrera adicional, no la solución de fondo.<\/i><\/p>¿Con cuál de las siguientes afirmaciones estaría de acuerdo el autor?", "options": ["La tecnología elimina por completo el riesgo asociado a la fatiga.", "La fatiga es el riesgo más visible en la operación minera.", "Los operadores cansados reaccionan más rápido ante emergencias.", "Los sistemas de detección deben complementarse con una buena gestión de turnos y descanso.", "Las alertas sonoras resultan inútiles para prevenir accidentes."], "answer": 3, "explanation": "El autor sostiene que el dispositivo es una barrera adicional que no sustituye la gestión de turnos ni el descanso."}, {"id": "i01", "area": "ingles", "subtype": "gramatica", "difficulty": "facil", "prompt": "Choose the correct option:<br><b>She works as ___ engineer at a copper mine.<\/b>", "options": ["a", "the", "an", "Ø (no article)"], "answer": 2, "explanation": "Se usa «an» antes de palabras que empiezan con sonido vocálico, como «engineer»."}, {"id": "i02", "area": "ingles", "subtype": "gramatica", "difficulty": "facil", "prompt": "Choose the correct option:<br><b>___ Andes are the longest continental mountain range in the world.<\/b>", "options": ["The", "A", "An", "Ø (no article)"], "answer": 0, "explanation": "Las cordilleras (nombres de cadenas montañosas en plural) llevan el artículo definido «the»."}, {"id": "i03", "area": "ingles", "subtype": "gramatica", "difficulty": "facil", "prompt": "Choose the correct option:<br><b>Every morning, the supervisor ___ the safety checklist before the shift starts.<\/b>", "options": ["review", "reviews", "reviewing", "have reviewed"], "answer": 1, "explanation": "Para rutinas se usa el presente simple; con sujeto en tercera persona singular el verbo lleva «-s»."}, {"id": "i04", "area": "ingles", "subtype": "gramatica", "difficulty": "media", "prompt": "Choose the correct option:<br><b>The plant ___ since 2015 without a major accident.<\/b>", "options": ["has operated", "operates", "is operating", "operated"], "answer": 0, "explanation": "«Since» con un punto de inicio que llega hasta el presente exige el presente perfecto."}, {"id": "i05", "area": "ingles", "subtype": "gramatica", "difficulty": "media", "prompt": "Choose the correct option:<br><b>While the technicians ___ the conveyor belt, the power suddenly went out.<\/b>", "options": ["are repairing", "were repairing", "repair", "have repaired"], "answer": 1, "explanation": "Una acción en progreso en el pasado interrumpida por otra se expresa con el pasado continuo."}, {"id": "i06", "area": "ingles", "subtype": "gramatica", "difficulty": "facil", "prompt": "Choose the correct option:<br><b>The meeting is scheduled ___ Monday ___ 8 a.m.<\/b>", "options": ["in – on", "at – in", "on – at", "on – in"], "answer": 2, "explanation": "Se usa «on» con días de la semana y «at» con horas exactas."}, {"id": "i07", "area": "ingles", "subtype": "gramatica", "difficulty": "media", "prompt": "Choose the correct option:<br><b>The new procedure is very different ___ the old one.<\/b>", "options": ["of", "at", "with", "from"], "answer": 3, "explanation": "La forma estándar es «different from»."}, {"id": "i08", "area": "ingles", "subtype": "gramatica", "difficulty": "media", "prompt": "Choose the correct option:<br><b>If the sensor detects high temperatures, the system ___ automatically.<\/b>", "options": ["would shut down", "shut down", "shuts down", "had shut down"], "answer": 2, "explanation": "Es un condicional cero (hecho general): «if» + presente simple, presente simple en la otra cláusula."}, {"id": "i09", "area": "ingles", "subtype": "gramatica", "difficulty": "dificil", "prompt": "Choose the correct option:<br><b>If the operator ___ the warning, the accident would not have happened.<\/b>", "options": ["followed", "had followed", "has followed", "would follow"], "answer": 1, "explanation": "El tercer condicional (situación pasada irreal) usa «if» + pasado perfecto y «would have» + participio."}, {"id": "i10", "area": "ingles", "subtype": "gramatica", "difficulty": "dificil", "prompt": "Choose the correct option:<br><b>The deeper the pit gets, ___ it becomes to transport the ore.<\/b>", "options": ["more expensive", "the more expensive", "the most expensive", "most expensive"], "answer": 1, "explanation": "La estructura comparativa doble es «the + comparativo…, the + comparativo»."}, {"id": "i11", "area": "ingles", "subtype": "vocabulario", "difficulty": "facil", "prompt": "A <b>helmet<\/b> is used to protect your:", "options": ["hands", "feet", "eyes", "head"], "answer": 3, "explanation": "«Helmet» es casco, que protege la cabeza."}, {"id": "i12", "area": "ingles", "subtype": "vocabulario", "difficulty": "facil", "prompt": "Choose the opposite of <b>safe<\/b>:", "options": ["dangerous", "secure", "careful", "protected"], "answer": 0, "explanation": "«Safe» significa seguro; su opuesto es «dangerous» (peligroso)."}, {"id": "i13", "area": "ingles", "subtype": "vocabulario", "difficulty": "media", "prompt": "Which word means <i>a machine that breaks large rocks into smaller pieces<\/i>?", "options": ["conveyor", "drill", "pump", "crusher"], "answer": 3, "explanation": "«Crusher» es la chancadora o trituradora."}, {"id": "i14", "area": "ingles", "subtype": "vocabulario", "difficulty": "media", "prompt": "Workers must wear <b>goggles<\/b> in this area. Goggles protect the:", "options": ["ears", "lungs", "knees", "eyes"], "answer": 3, "explanation": "«Goggles» son gafas o lentes de protección para los ojos."}, {"id": "i15", "area": "ingles", "subtype": "vocabulario", "difficulty": "media", "prompt": "Choose the word closest in meaning to <b>shortage<\/b>:<br><i>There is a water shortage in the region.<\/i>", "options": ["excess", "flood", "lack", "quality"], "answer": 2, "explanation": "«Shortage» significa escasez, es decir, «lack» (falta)."}, {"id": "i16", "area": "ingles", "subtype": "vocabulario", "difficulty": "dificil", "prompt": "Maintenance report: <i>“The pump failed due to excessive <b>wear<\/b>.”<\/i> In this sentence, <b>wear<\/b> means:", "options": ["clothing used for work", "a type of lubricant", "an electrical overload", "gradual damage caused by use and friction"], "answer": 3, "explanation": "En contexto técnico, «wear» es el desgaste progresivo por uso y fricción."}, {"id": "i17", "area": "ingles", "subtype": "vocabulario", "difficulty": "facil", "prompt": "A <b>conveyor belt<\/b> is used to:", "options": ["move materials from one place to another", "measure the temperature", "drill holes in rock", "store water"], "answer": 0, "explanation": "La faja transportadora («conveyor belt») traslada materiales de un punto a otro."}, {"id": "i18", "area": "ingles", "subtype": "comprension", "difficulty": "facil", "prompt": "<p><i><b>SAFETY NOTICE<\/b><br>Starting next Monday, all visitors to the concentrator plant must complete a 30-minute safety induction before entering the operational area. The induction will be held at the training center every day at 7:00 a.m. and 2:00 p.m. Visitors must bring a valid ID and wear safety boots; helmets, glasses and reflective vests will be provided at the entrance. Anyone who arrives late will have to wait for the next session. For more information, contact the Safety Department at extension 2045.<\/i><\/p>How long is the safety induction?", "options": ["30 minutes", "2 hours", "7 hours", "45 minutes"], "answer": 0, "explanation": "El aviso indica «a 30-minute safety induction»."}, {"id": "i19", "area": "ingles", "subtype": "comprension", "difficulty": "facil", "prompt": "<p><i><b>SAFETY NOTICE<\/b><br>Starting next Monday, all visitors to the concentrator plant must complete a 30-minute safety induction before entering the operational area. The induction will be held at the training center every day at 7:00 a.m. and 2:00 p.m. Visitors must bring a valid ID and wear safety boots; helmets, glasses and reflective vests will be provided at the entrance. Anyone who arrives late will have to wait for the next session. For more information, contact the Safety Department at extension 2045.<\/i><\/p>What must visitors bring or wear themselves?", "options": ["A helmet and safety glasses", "A valid ID and safety boots", "A reflective vest", "Nothing; everything is provided"], "answer": 1, "explanation": "El texto dice que deben traer un documento válido y usar botas de seguridad; casco, lentes y chaleco se entregan en la entrada."}, {"id": "i20", "area": "ingles", "subtype": "comprension", "difficulty": "media", "prompt": "<p><i><b>SAFETY NOTICE<\/b><br>Starting next Monday, all visitors to the concentrator plant must complete a 30-minute safety induction before entering the operational area. The induction will be held at the training center every day at 7:00 a.m. and 2:00 p.m. Visitors must bring a valid ID and wear safety boots; helmets, glasses and reflective vests will be provided at the entrance. Anyone who arrives late will have to wait for the next session. For more information, contact the Safety Department at extension 2045.<\/i><\/p>What happens if a visitor arrives late to the 7:00 a.m. session?", "options": ["They can join the session already in progress.", "They cannot visit the plant that week.", "They must call extension 2045 to enter.", "They must wait for the 2:00 p.m. session."], "answer": 3, "explanation": "Quien llega tarde debe esperar la siguiente sesión, que es la de las 2:00 p.m."}, {"id": "i21", "area": "ingles", "subtype": "comprension", "difficulty": "media", "prompt": "<p><i><b>SAFETY NOTICE<\/b><br>Starting next Monday, all visitors to the concentrator plant must complete a 30-minute safety induction before entering the operational area. The induction will be held at the training center every day at 7:00 a.m. and 2:00 p.m. Visitors must bring a valid ID and wear safety boots; helmets, glasses and reflective vests will be provided at the entrance. Anyone who arrives late will have to wait for the next session. For more information, contact the Safety Department at extension 2045.<\/i><\/p>In the notice, the word <b>provided<\/b> is closest in meaning to:", "options": ["required", "removed", "supplied", "checked"], "answer": 2, "explanation": "«Will be provided» significa que serán entregados o suministrados («supplied»)."}, {"id": "i22", "area": "ingles", "subtype": "comprension", "difficulty": "media", "prompt": "<p><i>Water recycling has become a priority for many mining companies operating in dry regions. In a typical copper concentrator, large amounts of water are needed to separate valuable minerals from waste rock. After this process, the water is sent to thickeners, where solid particles settle at the bottom. The clear water at the top is then pumped back to the plant and reused. Thanks to this system, some operations recover more than 80% of the water they use. However, recycling alone is not enough; companies must also reduce losses caused by evaporation and leaks.<\/i><\/p>What is the main purpose of the thickeners?", "options": ["To separate solid particles from the water", "To evaporate the water", "To crush the waste rock", "To pump fresh water from rivers"], "answer": 0, "explanation": "En los espesadores los sólidos se asientan en el fondo y el agua clara se recupera, es decir, separan sólidos del agua."}, {"id": "i23", "area": "ingles", "subtype": "comprension", "difficulty": "media", "prompt": "<p><i>Water recycling has become a priority for many mining companies operating in dry regions. In a typical copper concentrator, large amounts of water are needed to separate valuable minerals from waste rock. After this process, the water is sent to thickeners, where solid particles settle at the bottom. The clear water at the top is then pumped back to the plant and reused. Thanks to this system, some operations recover more than 80% of the water they use. However, recycling alone is not enough; companies must also reduce losses caused by evaporation and leaks.<\/i><\/p>According to the text, which statement is TRUE?", "options": ["All the water used in the process is recovered.", "Evaporation helps companies recover more water.", "Some operations recover more than 80% of the water they use.", "Water recycling is only important in wet regions."], "answer": 2, "explanation": "El texto afirma que algunas operaciones recuperan más del 80% del agua que usan."}, {"id": "i24", "area": "ingles", "subtype": "comprension", "difficulty": "dificil", "prompt": "<p><i>Water recycling has become a priority for many mining companies operating in dry regions. In a typical copper concentrator, large amounts of water are needed to separate valuable minerals from waste rock. After this process, the water is sent to thickeners, where solid particles settle at the bottom. The clear water at the top is then pumped back to the plant and reused. Thanks to this system, some operations recover more than 80% of the water they use. However, recycling alone is not enough; companies must also reduce losses caused by evaporation and leaks.<\/i><\/p>What can be inferred from the last sentence?", "options": ["Water recycling is not useful for mining companies.", "Even with recycling, some water is still lost.", "Leaks are the only cause of water loss.", "Evaporation does not affect mining operations."], "answer": 1, "explanation": "Al decir que reciclar «no es suficiente» y que hay pérdidas por evaporación y fugas, se infiere que parte del agua se pierde pese al reciclaje."}], "numerico_logico": [{"id": "n01", "area": "numerico", "subtype": "operaciones", "difficulty": "facil", "prompt": "Una planta concentradora produce <b>1 250 t<\/b> de concentrado de cobre por día. ¿Cuántas toneladas produce en <b>24 días<\/b>?", "options": ["30 000 t", "28 000 t", "32 500 t", "29 500 t"], "answer": 0, "explanation": "1 250 × 24 = 30 000 t."}, {"id": "n02", "area": "numerico", "subtype": "operaciones", "difficulty": "facil", "prompt": "Tres camiones de <b>240 t<\/b> de capacidad cada uno realizan <b>7 viajes<\/b> por turno a plena carga. ¿Cuántas toneladas transportan en total en un turno?", "options": ["1 680 t", "4 800 t", "5 040 t", "5 280 t"], "answer": 2, "explanation": "3 × 240 = 720 t por ronda; 720 × 7 = 5 040 t."}, {"id": "n03", "area": "numerico", "subtype": "operaciones", "difficulty": "facil", "prompt": "Calcule: <b>18 ÷ 3 × 2 + 4² − 5 × (6 − 2)<\/b>", "options": ["8", "3", "28", "−8"], "answer": 0, "explanation": "Paréntesis: 6 − 2 = 4. Potencia: 4² = 16. De izquierda a derecha: 18 ÷ 3 = 6; 6 × 2 = 12; 5 × 4 = 20. Luego 12 + 16 − 20 = 8."}, {"id": "n04", "area": "numerico", "subtype": "operaciones", "difficulty": "media", "prompt": "Un tanque de agua de proceso contiene <b>84 000 L<\/b>. Se extraen <b>3 500 L/h<\/b> y, al mismo tiempo, ingresan <b>1 400 L/h<\/b>. ¿En cuántas horas se vacía el tanque?", "options": ["24 h", "40 h", "60 h", "17 h"], "answer": 1, "explanation": "Salida neta = 3 500 − 1 400 = 2 100 L/h. Tiempo = 84 000 ÷ 2 100 = 40 h."}, {"id": "n05", "area": "numerico", "subtype": "operaciones", "difficulty": "dificil", "prompt": "Calcule: <b>(0,25 + 1/8) ÷ 0,375 × 2³ − √144<\/b>", "options": ["4", "0", "−11", "20", "−4"], "answer": 4, "explanation": "0,25 + 0,125 = 0,375; 0,375 ÷ 0,375 = 1; 1 × 8 = 8; √144 = 12; 8 − 12 = −4."}, {"id": "n06", "area": "numerico", "subtype": "porcentajes", "difficulty": "facil", "prompt": "La producción trimestral de cátodos fue de <b>80 000 t<\/b>. Si el siguiente trimestre aumenta en <b>15 %<\/b>, ¿cuál será la nueva producción?", "options": ["95 000 t", "88 000 t", "12 000 t", "92 000 t"], "answer": 3, "explanation": "15 % de 80 000 = 12 000. Nueva producción = 80 000 + 12 000 = 92 000 t."}, {"id": "n07", "area": "numerico", "subtype": "porcentajes", "difficulty": "facil", "prompt": "De los <b>1 200<\/b> trabajadores de una operación, el <b>35 %<\/b> labora en el turno noche. ¿Cuántos trabajadores hay en el turno noche?", "options": ["350", "380", "780", "420"], "answer": 3, "explanation": "0,35 × 1 200 = 420 trabajadores."}, {"id": "n08", "area": "numerico", "subtype": "porcentajes", "difficulty": "media", "prompt": "El precio de un insumo sube <b>20 %<\/b> en enero y luego baja <b>20 %<\/b> en febrero. Respecto al precio inicial, el precio final:", "options": ["No varió", "Aumentó 4 %", "Disminuyó 2 %", "Disminuyó 20 %", "Disminuyó 4 %"], "answer": 4, "explanation": "Factor total = 1,20 × 0,80 = 0,96, es decir, una disminución de 4 %."}, {"id": "n09", "area": "numerico", "subtype": "porcentajes", "difficulty": "media", "prompt": "Un mineral tiene una ley de <b>0,45 % de cobre<\/b>. ¿Cuántas toneladas de cobre contienen <b>120 000 t<\/b> de mineral?", "options": ["5 400 t", "54 t", "450 t", "540 t"], "answer": 3, "explanation": "0,45 % = 0,0045. 120 000 × 0,0045 = 540 t de cobre."}, {"id": "n10", "area": "numerico", "subtype": "porcentajes", "difficulty": "facil", "prompt": "El consumo diario de agua fresca bajó de <b>2 500 m³<\/b> a <b>2 150 m³<\/b> gracias a la recirculación. ¿En qué porcentaje se redujo?", "options": ["35 %", "14 %", "16,3 %", "12 %"], "answer": 1, "explanation": "Reducción = 2 500 − 2 150 = 350 m³. 350 ÷ 2 500 = 0,14 = 14 %."}, {"id": "n11", "area": "numerico", "subtype": "porcentajes", "difficulty": "dificil", "prompt": "Se desea obtener <b>396 t<\/b> de cobre fino. El mineral tiene una ley de <b>0,5 % Cu<\/b> y la recuperación metalúrgica de la planta es de <b>88 %<\/b>. ¿Cuántas toneladas de mineral se deben procesar?", "options": ["90 000 t", "79 200 t", "87 120 t", "100 000 t", "45 000 t"], "answer": 0, "explanation": "Cobre recuperado por tonelada = 0,005 × 0,88 = 0,0044 t. Mineral = 396 ÷ 0,0044 = 90 000 t."}, {"id": "n12", "area": "numerico", "subtype": "regla_de_tres", "difficulty": "facil", "prompt": "Si <b>4 camiones<\/b> transportan <b>1 800 t<\/b> de mineral en un turno, ¿cuántas toneladas transportarán <b>7 camiones<\/b> iguales en el mismo turno?", "options": ["3 150 t", "3 600 t", "2 700 t", "1 029 t"], "answer": 0, "explanation": "Regla de tres directa: 1 800 × 7 ÷ 4 = 3 150 t."}, {"id": "n13", "area": "numerico", "subtype": "regla_de_tres", "difficulty": "facil", "prompt": "<b>6 técnicos<\/b> realizan el mantenimiento de una faja en <b>15 días<\/b>. ¿En cuántos días lo harían <b>9 técnicos<\/b> con el mismo rendimiento?", "options": ["10 días", "22,5 días", "12 días", "9 días"], "answer": 0, "explanation": "Regla de tres inversa: 6 × 15 ÷ 9 = 10 días."}, {"id": "n14", "area": "numerico", "subtype": "regla_de_tres", "difficulty": "media", "prompt": "<b>8 perforadoras<\/b>, trabajando <b>6 h/día<\/b> durante <b>5 días<\/b>, perforan <b>480 taladros<\/b>. ¿Cuántos taladros perforarán <b>10 perforadoras<\/b>, trabajando <b>8 h/día<\/b> durante <b>4 días<\/b>?", "options": ["600", "512", "640", "720", "480"], "answer": 2, "explanation": "Todas las magnitudes son directamente proporcionales a los taladros: 480 × (10/8) × (8/6) × (4/5) = 640."}, {"id": "n15", "area": "numerico", "subtype": "regla_de_tres", "difficulty": "media", "prompt": "Una faja transportadora traslada <b>2 700 t<\/b> en <b>45 minutos<\/b>. A ritmo constante, ¿cuántas toneladas traslada en <b>2 h 20 min<\/b>?", "options": ["8 400 t", "6 300 t", "7 200 t", "8 100 t"], "answer": 0, "explanation": "2 h 20 min = 140 min. 2 700 ÷ 45 = 60 t/min. 60 × 140 = 8 400 t."}, {"id": "n16", "area": "numerico", "subtype": "regla_de_tres", "difficulty": "dificil", "prompt": "<b>12 obreros<\/b>, trabajando <b>8 h/día<\/b>, construyen <b>60 m<\/b> de canal de relaves en <b>10 días<\/b>. ¿Cuántos días necesitarán <b>16 obreros<\/b>, trabajando <b>6 h/día<\/b>, para construir <b>90 m<\/b> del mismo canal?", "options": ["10 días", "11,25 días", "20 días", "15 días", "13,5 días"], "answer": 3, "explanation": "Días = 10 × (12/16) × (8/6) × (90/60). Más obreros → menos días (inversa); menos horas → más días (inversa); más metros → más días (directa). 10 × 0,75 × 4/3 × 1,5 = 15 días."}, {"id": "n17", "area": "numerico", "subtype": "fracciones_proporciones", "difficulty": "facil", "prompt": "De un lote de <b>6 400 t<\/b> de concentrado, los <b>3/8<\/b> se destinan a exportación. ¿Cuántas toneladas se exportan?", "options": ["2 400 t", "4 000 t", "1 600 t", "2 133 t"], "answer": 0, "explanation": "6 400 ÷ 8 = 800; 800 × 3 = 2 400 t."}, {"id": "n18", "area": "numerico", "subtype": "fracciones_proporciones", "difficulty": "media", "prompt": "De la producción mensual de concentrado, <b>2/5<\/b> se embarca por el puerto; de lo que queda, <b>1/3<\/b> se envía a una refinería y el resto, <b>36 000 t<\/b>, se almacena. ¿Cuál fue la producción mensual?", "options": ["60 000 t", "108 000 t", "72 000 t", "90 000 t"], "answer": 3, "explanation": "Tras embarcar quedan 3/5 P. Se envía 1/3 de eso y queda 2/3 × 3/5 P = 2/5 P = 36 000 → P = 90 000 t."}, {"id": "n19", "area": "numerico", "subtype": "fracciones_proporciones", "difficulty": "facil", "prompt": "En una solución de lixiviación, el agua y el reactivo están en razón <b>7 : 2<\/b>. Si se preparan <b>1 350 L<\/b> de solución, ¿cuántos litros son de reactivo?", "options": ["385 L", "1 050 L", "300 L", "270 L"], "answer": 2, "explanation": "Partes totales = 7 + 2 = 9. 1 350 ÷ 9 = 150 L por parte. Reactivo = 2 × 150 = 300 L."}, {"id": "n20", "area": "numerico", "subtype": "fracciones_proporciones", "difficulty": "dificil", "prompt": "Un bono de <b>S/ 7 200<\/b> se reparte entre tres cuadrillas en forma <b>directamente proporcional<\/b> a 2, 3 y 4 e <b>inversamente proporcional<\/b> a 1, 3 y 2, respectivamente. ¿Cuánto recibe la segunda cuadrilla?", "options": ["S/ 2 400", "S/ 1 440", "S/ 2 880", "S/ 1 800", "S/ 960"], "answer": 1, "explanation": "Índices: 2/1 = 2; 3/3 = 1; 4/2 = 2. Suma = 5. Cada unidad = 7 200 ÷ 5 = 1 440. La segunda recibe 1 × 1 440 = S/ 1 440."}, {"id": "n21", "area": "numerico", "subtype": "problemas", "difficulty": "facil", "prompt": "Un supervisor tiene el triple de la edad de su hijo. Dentro de <b>12 años<\/b> tendrá el doble de la edad que tenga su hijo. ¿Qué edad tiene hoy el supervisor?", "options": ["24 años", "48 años", "42 años", "36 años"], "answer": 3, "explanation": "Hijo = x, supervisor = 3x. 3x + 12 = 2(x + 12) → x = 12. Supervisor = 36 años."}, {"id": "n22", "area": "numerico", "subtype": "problemas", "difficulty": "media", "prompt": "La bomba A vacía una poza en <b>12 h<\/b> y la bomba B la vacía en <b>18 h<\/b>. Si ambas trabajan juntas, ¿en cuánto tiempo vacían la poza?", "options": ["15 h", "7 h 30 min", "7 h 12 min", "6 h 48 min", "8 h"], "answer": 2, "explanation": "Juntas: 1/12 + 1/18 = 5/36 de poza por hora. Tiempo = 36/5 = 7,2 h = 7 h 12 min."}, {"id": "n23", "area": "numerico", "subtype": "problemas", "difficulty": "media", "prompt": "Dos camionetas parten al mismo tiempo desde dos campamentos separados <b>99 km<\/b> y avanzan una hacia la otra a <b>30 km/h<\/b> y <b>36 km/h<\/b>. ¿En cuánto tiempo se encuentran?", "options": ["1 h 39 min", "1 h 15 min", "1 h 30 min", "2 h", "3 h 18 min"], "answer": 2, "explanation": "Velocidad de acercamiento = 30 + 36 = 66 km/h. Tiempo = 99 ÷ 66 = 1,5 h = 1 h 30 min."}, {"id": "n24", "area": "numerico", "subtype": "problemas", "difficulty": "media", "prompt": "Se mezclan <b>400 t<\/b> de mineral con ley <b>0,60 % Cu<\/b> y <b>600 t<\/b> de mineral con ley <b>0,35 % Cu<\/b>. ¿Cuál es la ley de la mezcla?", "options": ["0,475 % Cu", "0,50 % Cu", "0,45 % Cu", "0,40 % Cu"], "answer": 2, "explanation": "Cobre: 400 × 0,006 = 2,4 t; 600 × 0,0035 = 2,1 t. Total 4,5 t en 1 000 t → 0,45 %."}, {"id": "n25", "area": "numerico", "subtype": "problemas", "difficulty": "dificil", "prompt": "Un camión sube cargado por una rampa a <b>20 km/h<\/b> y baja vacío por la misma rampa a <b>30 km/h<\/b>. ¿Cuál es su velocidad media en el viaje completo de ida y vuelta?", "options": ["25 km/h", "26 km/h", "22,5 km/h", "24 km/h"], "answer": 3, "explanation": "Sea d la longitud. Tiempo = d/20 + d/30 = d/12. Velocidad media = 2d ÷ (d/12) = 24 km/h (media armónica)."}, {"id": "n26", "area": "numerico", "subtype": "problemas", "difficulty": "media", "prompt": "Los equipos A y B juntos terminan un trabajo en <b>8 días<\/b>; A solo lo terminaría en <b>12 días<\/b>. Trabajan juntos <b>3 días<\/b> y luego B termina solo el resto. ¿Cuántos días adicionales trabaja B?", "options": ["10 días", "24 días", "12 días", "9 días", "15 días"], "answer": 4, "explanation": "B solo: 1/8 − 1/12 = 1/24 por día. En 3 días juntos hacen 3/8; faltan 5/8. Días de B = (5/8) ÷ (1/24) = 15."}, {"id": "n27", "area": "numerico", "subtype": "interpretacion_tablas", "difficulty": "facil", "prompt": "<p>Producción de concentrado de cobre:<\/p><table><tr><th>Mes<\/th><th>Concentrado (t)<\/th><\/tr><tr><td>Enero<\/td><td>42 000<\/td><\/tr><tr><td>Febrero<\/td><td>38 500<\/td><\/tr><tr><td>Marzo<\/td><td>45 500<\/td><\/tr><tr><td>Abril<\/td><td>44 000<\/td><\/tr><\/table><p>¿Cuál fue la producción mensual promedio?<\/p>", "options": ["42 500 t", "42 000 t", "43 000 t", "44 000 t"], "answer": 0, "explanation": "Total = 42 000 + 38 500 + 45 500 + 44 000 = 170 000 t. Promedio = 170 000 ÷ 4 = 42 500 t."}, {"id": "n28", "area": "numerico", "subtype": "interpretacion_tablas", "difficulty": "media", "prompt": "<p>Producción de concentrado de cobre:<\/p><table><tr><th>Mes<\/th><th>Concentrado (t)<\/th><\/tr><tr><td>Enero<\/td><td>42 000<\/td><\/tr><tr><td>Febrero<\/td><td>38 500<\/td><\/tr><tr><td>Marzo<\/td><td>45 500<\/td><\/tr><tr><td>Abril<\/td><td>44 000<\/td><\/tr><\/table><p>¿En qué porcentaje aproximado aumentó la producción de febrero a marzo?<\/p>", "options": ["15,4 %", "7,0 %", "18,2 %", "20,0 %"], "answer": 2, "explanation": "Aumento = 45 500 − 38 500 = 7 000. 7 000 ÷ 38 500 ≈ 0,1818 → 18,2 %."}, {"id": "n29", "area": "numerico", "subtype": "interpretacion_tablas", "difficulty": "media", "prompt": "<p>Consumo de agua por turno en la concentradora:<\/p><table><tr><th>Turno<\/th><th>Agua consumida (m³)<\/th><th>Mineral procesado (t)<\/th><\/tr><tr><td>A<\/td><td>3 600<\/td><td>12 000<\/td><\/tr><tr><td>B<\/td><td>2 940<\/td><td>10 500<\/td><\/tr><tr><td>C<\/td><td>2 880<\/td><td>9 000<\/td><\/tr><\/table><p>¿Qué turno tuvo el <b>menor consumo de agua por tonelada<\/b> procesada?<\/p>", "options": ["Turno B", "Turno A", "Turno C", "Los tres consumieron igual"], "answer": 0, "explanation": "A: 3 600/12 000 = 0,30 m³/t; B: 2 940/10 500 = 0,28 m³/t; C: 2 880/9 000 = 0,32 m³/t. El menor es el turno B."}, {"id": "n30", "area": "numerico", "subtype": "interpretacion_tablas", "difficulty": "media", "prompt": "<p>Horas registradas por la flota de acarreo en un mes:<\/p><table><tr><th>Camión<\/th><th>Horas programadas<\/th><th>Horas operativas<\/th><\/tr><tr><td>C-01<\/td><td>720<\/td><td>612<\/td><\/tr><tr><td>C-02<\/td><td>720<\/td><td>648<\/td><\/tr><tr><td>C-03<\/td><td>720<\/td><td>576<\/td><\/tr><tr><td>C-04<\/td><td>720<\/td><td>684<\/td><\/tr><\/table><p>La disponibilidad se calcula como horas operativas ÷ horas programadas. ¿Cuál es la disponibilidad de la flota completa?<\/p>", "options": ["85,0 %", "90,0 %", "87,5 %", "88,5 %"], "answer": 2, "explanation": "Operativas = 612 + 648 + 576 + 684 = 2 520 h. Programadas = 4 × 720 = 2 880 h. 2 520 ÷ 2 880 = 0,875 = 87,5 %."}, {"id": "n31", "area": "numerico", "subtype": "interpretacion_tablas", "difficulty": "dificil", "prompt": "<p>Mineral enviado a la chancadora en una semana:<\/p><table><tr><th>Zona del tajo<\/th><th>Mineral (t)<\/th><th>Ley (% Cu)<\/th><\/tr><tr><td>Norte<\/td><td>50 000<\/td><td>0,40<\/td><\/tr><tr><td>Sur<\/td><td>30 000<\/td><td>0,60<\/td><\/tr><tr><td>Este<\/td><td>20 000<\/td><td>0,50<\/td><\/tr><\/table><p>¿Cuál es la ley promedio ponderada del mineral enviado?<\/p>", "options": ["0,50 % Cu", "0,46 % Cu", "0,48 % Cu", "0,52 % Cu"], "answer": 2, "explanation": "Cobre contenido: 50 000 × 0,004 = 200 t; 30 000 × 0,006 = 180 t; 20 000 × 0,005 = 100 t. Total 480 t en 100 000 t → 0,48 %. (El promedio simple, 0,50 %, es incorrecto porque los tonelajes difieren.)"}, {"id": "n32", "area": "numerico", "subtype": "interpretacion_tablas", "difficulty": "facil", "prompt": "<p>Producción de concentrado de cobre:<\/p><table><tr><th>Mes<\/th><th>Concentrado (t)<\/th><\/tr><tr><td>Enero<\/td><td>42 000<\/td><\/tr><tr><td>Febrero<\/td><td>38 500<\/td><\/tr><tr><td>Marzo<\/td><td>45 500<\/td><\/tr><tr><td>Abril<\/td><td>44 000<\/td><\/tr><\/table><p>¿Cuál es la diferencia entre el mes de mayor y el de menor producción?<\/p>", "options": ["3 500 t", "5 500 t", "6 000 t", "7 000 t"], "answer": 3, "explanation": "Mayor: marzo (45 500 t). Menor: febrero (38 500 t). Diferencia = 7 000 t."}, {"id": "l01", "area": "logico", "subtype": "series_numericas", "difficulty": "facil", "prompt": "¿Qué número continúa la serie?<br><b>3, 7, 11, 15, 19, ...<\/b>", "options": ["21", "23", "24", "25"], "answer": 1, "explanation": "Se suma 4 cada vez: 19 + 4 = 23."}, {"id": "l02", "area": "logico", "subtype": "series_numericas", "difficulty": "facil", "prompt": "¿Qué número continúa la serie?<br><b>2, 6, 18, 54, ...<\/b>", "options": ["108", "72", "162", "216"], "answer": 2, "explanation": "Cada término se multiplica por 3: 54 × 3 = 162."}, {"id": "l03", "area": "logico", "subtype": "series_numericas", "difficulty": "media", "prompt": "¿Qué número continúa la serie?<br><b>2, 5, 10, 17, 26, ...<\/b>", "options": ["37", "35", "36", "39"], "answer": 0, "explanation": "Cada término es n² + 1 (n = 1, 2, 3...): 6² + 1 = 37. También: diferencias 3, 5, 7, 9, 11."}, {"id": "l04", "area": "logico", "subtype": "series_numericas", "difficulty": "facil", "prompt": "¿Qué número continúa la serie?<br><b>5, 6, 8, 11, 15, ...<\/b>", "options": ["19", "21", "20", "18"], "answer": 2, "explanation": "Diferencias: +1, +2, +3, +4, +5. 15 + 5 = 20."}, {"id": "l05", "area": "logico", "subtype": "series_numericas", "difficulty": "media", "prompt": "¿Qué número continúa la serie?<br><b>3, 4, 8, 17, 33, ...<\/b>", "options": ["49", "56", "58", "66"], "answer": 2, "explanation": "Se suman cuadrados perfectos: +1, +4, +9, +16, +25. 33 + 25 = 58."}, {"id": "l06", "area": "logico", "subtype": "series_numericas", "difficulty": "facil", "prompt": "¿Qué número continúa la serie?<br><b>2, 3, 5, 9, 17, ...<\/b>", "options": ["25", "34", "31", "33"], "answer": 3, "explanation": "Diferencias: +1, +2, +4, +8, +16 (se duplican). 17 + 16 = 33."}, {"id": "l07", "area": "logico", "subtype": "series_numericas", "difficulty": "dificil", "prompt": "¿Qué número continúa la serie?<br><b>4, 20, 8, 17, 16, 14, 32, ...<\/b>", "options": ["64", "12", "10", "11"], "answer": 3, "explanation": "Son dos series intercaladas. Posiciones impares: 4, 8, 16, 32 (×2). Posiciones pares: 20, 17, 14, ... (−3). El término pedido es par: 14 − 3 = 11."}, {"id": "l08", "area": "logico", "subtype": "series_numericas", "difficulty": "dificil", "prompt": "¿Qué número continúa la serie?<br><b>2, 3, 7, 22, 89, ...<\/b>", "options": ["446", "356", "445", "534", "447"], "answer": 0, "explanation": "Regla: ×1 + 1, ×2 + 1, ×3 + 1, ×4 + 1, ×5 + 1. Entonces 89 × 5 + 1 = 446."}, {"id": "l09", "area": "logico", "subtype": "series_letras", "difficulty": "facil", "prompt": "¿Qué letra continúa la serie?<br><b>A, C, E, G, ...<\/b><br><i>(Considere el alfabeto español de 27 letras, incluida la Ñ.)<\/i>", "options": ["H", "J", "K", "I"], "answer": 3, "explanation": "Se avanza de 2 en 2 (se salta una letra): A, C, E, G, I."}, {"id": "l10", "area": "logico", "subtype": "series_letras", "difficulty": "facil", "prompt": "¿Qué letra continúa la serie?<br><b>B, E, H, K, ...<\/b><br><i>(Considere el alfabeto español de 27 letras, incluida la Ñ.)<\/i>", "options": ["Ñ", "M", "O", "N"], "answer": 3, "explanation": "Posiciones 2, 5, 8, 11 (+3). Sigue la posición 14: N."}, {"id": "l11", "area": "logico", "subtype": "series_letras", "difficulty": "media", "prompt": "¿Qué letra continúa la serie?<br><b>Z, X, U, Q, ...<\/b><br><i>(Considere el alfabeto español de 27 letras, incluida la Ñ.)<\/i>", "options": ["M", "L", "N", "Ñ"], "answer": 0, "explanation": "Posiciones 27, 25, 22, 18: se resta 2, 3, 4 y luego 5. 18 − 5 = 13 → M."}, {"id": "l12", "area": "logico", "subtype": "series_letras", "difficulty": "media", "prompt": "¿Qué letra continúa la serie?<br><b>D, F, I, M, ...<\/b><br><i>(Considere el alfabeto español de 27 letras, incluida la Ñ.)<\/i>", "options": ["P", "R", "O", "Q"], "answer": 3, "explanation": "Posiciones 4, 6, 9, 13: +2, +3, +4, +5. 13 + 5 = 18 → Q (en el alfabeto de 27 letras, P es 17 y Q es 18)."}, {"id": "l13", "area": "logico", "subtype": "series_letras", "difficulty": "dificil", "prompt": "¿Qué par de letras continúa la serie?<br><b>A, Z, C, X, E, V, ...<\/b><br><i>(Considere el alfabeto español de 27 letras, incluida la Ñ.)<\/i>", "options": ["G, U", "F, T", "H, S", "G, T"], "answer": 3, "explanation": "Dos series intercaladas: A, C, E, ... avanza de 2 en 2 → G (7). Z, X, V, ... retrocede de 2 en 2 → posición 21 → T."}, {"id": "l14", "area": "logico", "subtype": "series_alfanumericas", "difficulty": "facil", "prompt": "¿Qué término continúa la serie?<br><b>A2, C4, E6, G8, ...<\/b><br><i>(Considere el alfabeto español de 27 letras, incluida la Ñ.)<\/i>", "options": ["H10", "I9", "J10", "I10"], "answer": 3, "explanation": "Letras de 2 en 2 (A, C, E, G, I) y números pares (+2): I10."}, {"id": "l15", "area": "logico", "subtype": "series_alfanumericas", "difficulty": "media", "prompt": "¿Qué término continúa la serie?<br><b>1B, 4D, 9F, 16H, ...<\/b><br><i>(Considere el alfabeto español de 27 letras, incluida la Ñ.)<\/i>", "options": ["25I", "20J", "25J", "36J"], "answer": 2, "explanation": "Números: cuadrados 1, 4, 9, 16, 25. Letras de 2 en 2: B, D, F, H, J. Resultado: 25J."}, {"id": "l16", "area": "logico", "subtype": "series_alfanumericas", "difficulty": "media", "prompt": "¿Qué término continúa la serie?<br><b>Z1, W3, S6, ...<\/b><br><i>(Considere el alfabeto español de 27 letras, incluida la Ñ.)<\/i>", "options": ["O10", "N10", "Ñ9", "Ñ10"], "answer": 3, "explanation": "Letras: posiciones 27, 24, 20 (−3, −4) → 20 − 5 = 15 → Ñ. Números: 1, 3, 6 (+2, +3) → 6 + 4 = 10. Resultado: Ñ10."}, {"id": "l17", "area": "logico", "subtype": "silogismos", "difficulty": "facil", "prompt": "<b>Premisa 1:<\/b> Todos los operadores de camión tienen licencia de conducir categoría A-IIIc.<br><b>Premisa 2:<\/b> Julio es operador de camión.<br>¿Qué conclusión se deduce?", "options": ["Todos los que tienen licencia A-IIIc son operadores de camión.", "Julio no tiene licencia A-IIIc.", "Solo Julio tiene licencia A-IIIc.", "Julio tiene licencia categoría A-IIIc."], "answer": 3, "explanation": "Si todos los operadores tienen esa licencia y Julio es operador, Julio la tiene. Las demás no se deducen de las premisas."}, {"id": "l18", "area": "logico", "subtype": "silogismos", "difficulty": "facil", "prompt": "<b>Premisa 1:<\/b> Ningún equipo en mantenimiento está operativo.<br><b>Premisa 2:<\/b> La pala P-03 está en mantenimiento.<br>¿Qué conclusión se deduce?", "options": ["La pala P-03 no está operativa.", "La pala P-03 está operativa.", "Todos los equipos no operativos están en mantenimiento.", "Ninguna pala está operativa."], "answer": 0, "explanation": "Lo que está en mantenimiento no está operativo; P-03 está en mantenimiento, por tanto no está operativa."}, {"id": "l19", "area": "logico", "subtype": "silogismos", "difficulty": "media", "prompt": "<b>Premisa 1:<\/b> Todos los ingenieros de turno usan casco blanco.<br><b>Premisa 2:<\/b> Algunas personas que usan casco blanco son visitantes.<br>¿Qué conclusión se deduce <i>necesariamente<\/i>?", "options": ["Algunos ingenieros de turno son visitantes.", "No se puede concluir nada seguro sobre la relación entre ingenieros y visitantes.", "Ningún ingeniero de turno es visitante.", "Todos los visitantes son ingenieros de turno."], "answer": 1, "explanation": "El término medio (usar casco blanco) no se distribuye en ninguna premisa: los visitantes con casco pueden o no coincidir con los ingenieros. Ninguna relación es necesaria."}, {"id": "l20", "area": "logico", "subtype": "silogismos", "difficulty": "media", "prompt": "<b>Premisa 1:<\/b> Todos los supervisores son ingenieros.<br><b>Premisa 2:<\/b> Algunos supervisores son geólogos.<br>¿Qué conclusión es válida?", "options": ["Todos los ingenieros son geólogos.", "Algunos ingenieros son geólogos.", "Todos los geólogos son supervisores.", "Algunos ingenieros no son geólogos."], "answer": 1, "explanation": "Los supervisores que son geólogos también son ingenieros (premisa 1); por tanto, existen ingenieros que son geólogos."}, {"id": "l21", "area": "logico", "subtype": "silogismos", "difficulty": "facil", "prompt": "<b>Premisa 1:<\/b> Ningún practicante ejecuta voladuras.<br><b>Premisa 2:<\/b> Todos los becarios son practicantes.<br>¿Qué conclusión se deduce?", "options": ["Ningún becario ejecuta voladuras.", "Algunos becarios ejecutan voladuras.", "Todos los practicantes son becarios.", "Solo los becarios no ejecutan voladuras."], "answer": 0, "explanation": "Los becarios están incluidos en los practicantes, y ningún practicante ejecuta voladuras; luego ningún becario lo hace."}, {"id": "l22", "area": "logico", "subtype": "silogismos", "difficulty": "dificil", "prompt": "<b>Premisa 1:<\/b> Todos los camiones autónomos tienen sensor LiDAR.<br><b>Premisa 2:<\/b> Ningún equipo de modelo antiguo tiene sensor LiDAR.<br>¿Qué conclusión es válida?", "options": ["Algunos equipos de modelo antiguo son camiones autónomos.", "Todos los equipos con LiDAR son camiones autónomos.", "Algunos camiones autónomos no tienen LiDAR.", "No se puede concluir nada.", "Ningún camión autónomo es un equipo de modelo antiguo."], "answer": 4, "explanation": "Si un camión autónomo fuera de modelo antiguo, tendría LiDAR (P1) y no lo tendría (P2): contradicción. Por tanto, ningún camión autónomo es de modelo antiguo."}, {"id": "l23", "area": "logico", "subtype": "ordenamiento", "difficulty": "facil", "prompt": "En un mes, la pala A cargó más toneladas que la pala B; la pala C cargó menos que la B; y la pala D cargó más que la A. ¿Qué pala cargó <b>menos<\/b> toneladas?", "options": ["Pala C", "Pala B", "Pala A", "Pala D"], "answer": 0, "explanation": "Orden de mayor a menor: D > A > B > C. La que cargó menos es la C."}, {"id": "l24", "area": "logico", "subtype": "ordenamiento", "difficulty": "media", "prompt": "Cinco becarios se sientan en una fila de 5 asientos numerados del 1 (extremo izquierdo) al 5 (extremo derecho):<br>• Carla está en el asiento central.<br>• Ana está junto a Carla, a su izquierda.<br>• Beto está en el extremo derecho.<br>• Elsa no está junto a Beto.<br>¿Quién ocupa el asiento 1?", "options": ["Dante", "Ana", "Beto", "Elsa"], "answer": 3, "explanation": "Carla = 3, Ana = 2, Beto = 5. Quedan 1 y 4 para Dante y Elsa. Elsa no puede estar en 4 (junto a Beto), así que Elsa = 1 y Dante = 4."}, {"id": "l25", "area": "logico", "subtype": "ordenamiento", "difficulty": "facil", "prompt": "En la evaluación de seguridad, Pablo obtuvo más puntos que Quispe pero menos que Ríos. Salas obtuvo menos que Quispe y Torres obtuvo más que Ríos. ¿Quién ocupó el <b>tercer lugar<\/b>?", "options": ["Quispe", "Ríos", "Torres", "Pablo"], "answer": 3, "explanation": "Orden de mayor a menor: Torres > Ríos > Pablo > Quispe > Salas. Tercer lugar: Pablo."}, {"id": "l26", "area": "logico", "subtype": "ordenamiento", "difficulty": "dificil", "prompt": "Un edificio administrativo tiene 5 pisos (1 = el más bajo) y cada uno lo ocupa un área distinta: Logística, Seguridad, Mantenimiento, RRHH y Geología.<br>• Mantenimiento está en el piso 2.<br>• Logística está inmediatamente encima de Geología.<br>• Seguridad no está ni en el primer ni en el último piso.<br>• RRHH está en un piso más bajo que Seguridad.<br>¿Qué área está en el <b>piso 3<\/b>?", "options": ["Geología", "Seguridad", "RRHH", "Logística"], "answer": 1, "explanation": "Geología–Logística deben ser pisos consecutivos sin usar el 2: (3,4) o (4,5). Si fueran 3 y 4, Seguridad quedaría en 1 o 5 (prohibido). Entonces Geología = 4, Logística = 5; quedan 1 y 3: Seguridad = 3 y RRHH = 1 (más bajo que Seguridad)."}, {"id": "l27", "area": "logico", "subtype": "ordenamiento", "difficulty": "media", "prompt": "Cinco operadores llegan a la charla de seguridad. Nora llegó antes que Luis, y Luis antes que Mario. Óscar llegó inmediatamente después de Mario. Pedro llegó después de Nora pero antes de Luis. ¿Quién llegó en <b>cuarto<\/b> lugar?", "options": ["Luis", "Óscar", "Pedro", "Mario"], "answer": 3, "explanation": "Nora &lt; Pedro &lt; Luis &lt; Mario, y Óscar justo después de Mario: Nora, Pedro, Luis, Mario, Óscar. Cuarto: Mario."}, {"id": "l28", "area": "logico", "subtype": "verdad_mentira_o_deduccion", "difficulty": "media", "prompt": "Se sabe que: «<i>Solo los trabajadores que aprobaron la inducción pueden ingresar al tajo.<\/i>» Rosa ingresó al tajo esta mañana. ¿Qué se deduce con certeza?", "options": ["Rosa es supervisora.", "Rosa aprobó la inducción.", "Todos los que aprobaron la inducción ingresaron al tajo.", "Rosa no aprobó la inducción."], "answer": 1, "explanation": "«Solo los que aprobaron pueden ingresar» equivale a: si ingresa, entonces aprobó. Rosa ingresó, luego aprobó la inducción."}, {"id": "l29", "area": "logico", "subtype": "verdad_mentira_o_deduccion", "difficulty": "facil", "prompt": "Carlos es más alto que Diego. Diego es más alto que Eva. ¿Cuál afirmación es <b>necesariamente<\/b> verdadera?", "options": ["Carlos es más alto que Eva.", "Eva es más alta que Carlos.", "Diego es el más alto.", "Eva y Carlos tienen la misma estatura."], "answer": 0, "explanation": "Por transitividad: Carlos > Diego > Eva, luego Carlos > Eva."}, {"id": "l30", "area": "logico", "subtype": "verdad_mentira_o_deduccion", "difficulty": "media", "prompt": "Uno de tres operadores (A, B o C) dejó encendido un equipo al terminar el turno. Al preguntarles:<br>• A: «Fue B».<br>• B: «Yo no fui».<br>• C: «Yo no fui».<br>Si <b>solo uno<\/b> dice la verdad, ¿quién dejó encendido el equipo?", "options": ["A", "B", "No se puede determinar", "C"], "answer": 3, "explanation": "Si fue A: B y C dicen verdad (2). Si fue B: A y C dicen verdad (2). Si fue C: solo B dice verdad (1). Por tanto, fue C."}, {"id": "l31", "area": "logico", "subtype": "verdad_mentira_o_deduccion", "difficulty": "dificil", "prompt": "Una de cuatro personas (P, Q, R o S) movió una muestra del laboratorio sin registrarla. Declaran:<br>• P: «Fue Q».<br>• Q: «Fue S».<br>• R: «Yo no fui».<br>• S: «Q miente».<br>Si <b>solo una<\/b> persona miente, ¿quién movió la muestra?", "options": ["P", "R", "S", "Q"], "answer": 3, "explanation": "Q y S se contradicen, así que el mentiroso e
