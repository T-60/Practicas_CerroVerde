table><br>¿Qué devuelve <code>=BUSCARV(\"CM-03\";A2:C6;3;FALSO)<\/code>?", "options": ["#N/D", "290", "Camión CAT 793", "227"], "answer": 3, "explanation": "BUSCARV (VLOOKUP) busca \"CM-03\" en la primera columna del rango, con FALSO exige coincidencia exacta y devuelve la 3.ª columna del rango: 227."}, {"id": "x14", "area": "excel", "subtype": "busqueda", "difficulty": "media", "prompt": "Con el mismo maestro de equipos:<br><table><tr><th><\/th><th>A<\/th><th>B<\/th><th>C<\/th><\/tr><tr><th>1<\/th><td><b>Código<\/b><\/td><td><b>Equipo<\/b><\/td><td><b>Capacidad (t)<\/b><\/td><\/tr><tr><th>2<\/th><td>CM-01<\/td><td>Camión CAT 797<\/td><td>363<\/td><\/tr><tr><th>3<\/th><td>CM-02<\/td><td>Camión Komatsu 930<\/td><td>290<\/td><\/tr><tr><th>4<\/th><td>CM-03<\/td><td>Camión CAT 793<\/td><td>227<\/td><\/tr><tr><th>5<\/th><td>PL-01<\/td><td>Pala P&amp;H 4100<\/td><td>109<\/td><\/tr><tr><th>6<\/th><td>PL-02<\/td><td>Pala CAT 7495<\/td><td>98<\/td><\/tr><\/table><br>¿Qué devuelve <code>=BUSCARV(\"CM-03\";A2:C6;4;FALSO)<\/code>?", "options": ["#¡REF!", "#¡VALOR!", "#N/D", "0"], "answer": 0, "explanation": "El rango A2:C6 solo tiene 3 columnas; pedir la columna 4 genera #¡REF! (#REF! en inglés). #N/D (#N/A) aparecería si el código no existiera."}, {"id": "x15", "area": "excel", "subtype": "busqueda", "difficulty": "dificil", "prompt": "Tabla de bono por toneladas extra (ordenada ascendente):<br><table><tr><th><\/th><th>A<\/th><th>B<\/th><\/tr><tr><th>1<\/th><td><b>Desde (t)<\/b><\/td><td><b>Bono<\/b><\/td><\/tr><tr><th>2<\/th><td>0<\/td><td>0%<\/td><\/tr><tr><th>3<\/th><td>1000<\/td><td>2%<\/td><\/tr><tr><th>4<\/th><td>2000<\/td><td>5%<\/td><\/tr><tr><th>5<\/th><td>3000<\/td><td>8%<\/td><\/tr><\/table><br>¿Qué devuelve <code>=BUSCARV(2500;A2:B5;2;VERDADERO)<\/code>?", "options": ["5%", "#N/D", "2%", "8%"], "answer": 0, "explanation": "Con VERDADERO, BUSCARV (VLOOKUP) hace coincidencia aproximada: toma el mayor valor menor o igual a 2500, que es 2000, y devuelve 5%. Requiere la primera columna ordenada ascendentemente."}, {"id": "x16", "area": "excel", "subtype": "busqueda", "difficulty": "media", "prompt": "Tratamiento por molino (t/h):<br><table><tr><th><\/th><th>A<\/th><th>B<\/th><th>C<\/th><\/tr><tr><th>1<\/th><td><b>Equipo<\/b><\/td><td><b>Tipo<\/b><\/td><td><b>t/h<\/b><\/td><\/tr><tr><th>2<\/th><td>Molino 1<\/td><td>SAG<\/td><td>4200<\/td><\/tr><tr><th>3<\/th><td>Molino 2<\/td><td>Bolas<\/td><td>3850<\/td><\/tr><tr><th>4<\/th><td>Molino 3<\/td><td>Bolas<\/td><td>3900<\/td><\/tr><tr><th>5<\/th><td>Molino 4<\/td><td>SAG<\/td><td>4100<\/td><\/tr><\/table><br>¿Qué devuelve <code>=BUSCARX(\"Molino 5\";A2:A5;C2:C5;\"No existe\")<\/code>?", "options": ["#N/D", "No existe", "4100", "0"], "answer": 1, "explanation": "BUSCARX (XLOOKUP) permite un 4.º argumento [si_no_se_encuentra]. Como \"Molino 5\" no está en A2:A5, devuelve \"No existe\" en vez de #N/D."}, {"id": "x17", "area": "excel", "subtype": "busqueda", "difficulty": "dificil", "prompt": "Índice de cumplimiento de checklist preuso por operador:<br><table><tr><th><\/th><th>A<\/th><th>B<\/th><th>C<\/th><\/tr><tr><th>1<\/th><td><b>Operador<\/b><\/td><td><b>Turno<\/b><\/td><td><b>Cumplimiento %<\/b><\/td><\/tr><tr><th>2<\/th><td>Quispe<\/td><td>Turno A<\/td><td>96<\/td><\/tr><tr><th>3<\/th><td>Mamani<\/td><td>Turno B<\/td><td>91<\/td><\/tr><tr><th>4<\/th><td>Flores<\/td><td>Turno C<\/td><td>98<\/td><\/tr><tr><th>5<\/th><td>Huamán<\/td><td>Turno A<\/td><td>94<\/td><\/tr><tr><th>6<\/th><td>Torres<\/td><td>Turno B<\/td><td>89<\/td><\/tr><\/table><br>¿Qué devuelve <code>=INDICE(A2:A6;COINCIDIR(MAX(C2:C6);C2:C6;0))<\/code>?", "options": ["Quispe", "3", "Flores", "98"], "answer": 2, "explanation": "MAX (MAX) da 98; COINCIDIR (MATCH) con 0 encuentra su posición exacta (3) dentro de C2:C6; INDICE (INDEX) devuelve el 3.º elemento de A2:A6: \"Flores\". INDICE/COINCIDIR puede buscar hacia la izquierda, a diferencia de BUSCARV."}, {"id": "x18", "area": "excel", "subtype": "referencias", "difficulty": "facil", "prompt": "En C2 está <code>=B2*$E$1<\/code> (E1 contiene la ley de cobre). Si copias C2 hasta C5, ¿qué fórmula queda en C5?", "options": ["=E5*$B$1", "=B5*$E$1", "=B5*$E$4", "=B2*$E$1"], "answer": 1, "explanation": "B2 es referencia relativa: al bajar 3 filas pasa a B5. $E$1 es absoluta (fija columna y fila), no cambia."}, {"id": "x19", "area": "excel", "subtype": "referencias", "difficulty": "dificil", "prompt": "En C3 está <code>=$A3*B$1<\/code>. Copias C3 y la pegas en D5. ¿Qué fórmula queda en D5?", "options": ["=$A3*C$3", "=$A5*C$1", "=$B5*C$1", "=$A5*B$1"], "answer": 1, "explanation": "Se desplaza +1 columna y +2 filas. En $A3 la columna está fija y la fila es relativa → $A5. En B$1 la fila está fija y la columna es relativa → C$1. Son referencias mixtas."}, {"id": "x20", "area": "excel", "subtype": "referencias", "difficulty": "media", "prompt": "En B4 está <code>=SUMA(A1:A3)<\/code>. Si copias B4 a C6, ¿qué fórmula queda en C6?", "options": ["=SUMA(A3:A5)", "=SUMA(B3:B5)", "=SUMA(B1:B3)", "=SUMA(A1:A3)"], "answer": 1, "explanation": "Todo el rango es relativo: +1 columna y +2 filas, así que A1:A3 se convierte en B3:B5. SUMA = SUM."}, {"id": "x21", "area": "excel", "subtype": "referencias", "difficulty": "media", "prompt": "Escribes <code>=A1<\/code> y, con el cursor sobre la referencia, presionas <b>F4<\/b> dos veces. ¿Qué referencia obtienes?", "options": ["$A$1", "$A1", "A$1", "A1"], "answer": 2, "explanation": "F4 rota: A1 → $A$1 (1.ª vez) → A$1 (2.ª, fila fija) → $A1 (3.ª, columna fija) → A1 (4.ª)."}, {"id": "x22", "area": "excel", "subtype": "formato_datos", "difficulty": "facil", "prompt": "Tienes 5 000 filas con fecha, turno, guardia, equipo y toneladas. Necesitas un resumen de toneladas totales por turno y por mes que puedas reorganizar rápido. ¿Qué herramienta es la más adecuada?", "options": ["Tabla dinámica", "Formato condicional", "Ordenar de A a Z", "Validación de datos"], "answer": 0, "explanation": "La tabla dinámica (PivotTable) agrupa y resume (suma, cuenta, promedia) grandes volúmenes por varias dimensiones y se reorganiza arrastrando campos."}, {"id": "x23", "area": "excel", "subtype": "formato_datos", "difficulty": "media", "prompt": "En un registro de inspecciones quieres que la columna \"Turno\" solo acepte \"Día\" o \"Noche\" mediante una lista desplegable. ¿Qué usas?", "options": ["Insertar &gt; Segmentación de datos", "Inicio &gt; Formato condicional", "Datos &gt; Quitar duplicados", "Datos &gt; Validación de datos &gt; Lista"], "answer": 3, "explanation": "La validación de datos (Data Validation) con tipo Lista restringe la entrada a valores permitidos y muestra una lista desplegable, evitando errores de digitación."}, {"id": "x24", "area": "excel", "subtype": "formato_datos", "difficulty": "dificil", "prompt": "Aplicas un Autofiltro para mostrar solo la guardia \"Día\":<br><table><tr><th><\/th><th>A<\/th><th>B<\/th><th>C<\/th><\/tr><tr><th>1<\/th><td><b>Día<\/b><\/td><td><b>Guardia<\/b><\/td><td><b>Toneladas<\/b><\/td><\/tr><tr><th>2<\/th><td>Lun<\/td><td>Día<\/td><td>600<\/td><\/tr><tr><th>3<\/th><td>Lun<\/td><td>Noche<\/td><td>550<\/td><\/tr><tr><th>4<\/th><td>Mar<\/td><td>Día<\/td><td>620<\/td><\/tr><tr><th>5<\/th><td>Mar<\/td><td>Noche<\/td><td>580<\/td><\/tr><\/table><br>¿Qué fórmula devuelve <b>1220<\/b> (solo las filas visibles)?", "options": ["=CONTAR(C2:C5)", "=SUMA(C2:C5)", "=SUMAR(C2:C5)", "=SUBTOTALES(9;C2:C5)"], "answer": 3, "explanation": "SUBTOTALES (SUBTOTAL) con función 9 (suma) ignora las filas ocultas por un filtro: 600+620 = 1220. SUMA (SUM) sumaría todas (2350). \"SUMAR\" no existe."}, {"id": "x25", "area": "excel", "subtype": "formato_datos", "difficulty": "dificil", "prompt": "Quieres resaltar en rojo TODA la fila (A2:F100) cuando la disponibilidad en la columna D sea menor a 85%. En Formato condicional &gt; Usar una fórmula, seleccionando A2:F100, ¿qué fórmula escribes?", "options": ["=$D$2&lt;0,85", "=$D2&lt;0,85", "=D2&lt;0,85", "=D$2&lt;0,85"], "answer": 1, "explanation": "Hay que fijar la columna D ($D) para que todas las celdas de la fila miren la disponibilidad, y dejar la fila relativa (2) para que cada fila se evalúe a sí misma. $D$2 aplicaría la fila 2 a todo el rango. (En Excel en español el decimal es coma: 0,85.)"}, {"id": "x26", "area": "excel", "subtype": "graficos", "difficulty": "facil", "prompt": "Debes mostrar la evolución mensual de la producción de cobre fino durante los últimos 12 meses. ¿Qué gráfico es el más adecuado?", "options": ["Radial", "Líneas", "Dispersión", "Circular"], "answer": 1, "explanation": "El gráfico de líneas (Line chart) muestra tendencias en el tiempo con categorías ordenadas (meses). El circular sirve para partes de un todo."}, {"id": "x27", "area": "excel", "subtype": "graficos", "difficulty": "media", "prompt": "Quieres analizar si existe relación entre la dureza del mineral (eje X) y el consumo de energía del molino en kWh/t (eje Y) para 200 muestras. ¿Qué gráfico usas?", "options": ["Columnas agrupadas", "Circular", "Áreas apiladas", "Dispersión (XY)"], "answer": 3, "explanation": "El gráfico de dispersión (Scatter chart) muestra la relación entre dos variables numéricas; permite añadir línea de tendencia y R²."}, {"id": "x28", "area": "excel", "subtype": "graficos", "difficulty": "dificil", "prompt": "Tienes las horas de parada de la planta por causa (falla eléctrica, atoro de chute, cambio de liners, etc.) y quieres identificar el 20% de causas que generan ~80% de las horas perdidas. ¿Qué gráfico es el más útil?", "options": ["Pareto (columnas ordenadas + línea acumulada)", "Circular 3D", "Líneas con marcadores", "Anillo"], "answer": 0, "explanation": "El diagrama de Pareto (Pareto chart, en Excel: Histograma &gt; Pareto) ordena causas de mayor a menor y añade el porcentaje acumulado, ideal para priorizar acciones de mejora."}], "sjt": [{"id": "s01", "area": "competencias", "subtype": "sjt", "competencia": "Seguridad", "prompt": "Eres becario en la planta concentradora. Durante una ronda con un técnico notas que la guarda de protección de una faja transportadora está suelta y la faja sigue operando. El técnico te dice: \"Tranquilo, la reportamos al terminar el turno, falta poco\".", "options": ["Plantearle con respeto que la condición es un riesgo de atrapamiento, pedir detener la faja o aislar la zona y avisar de inmediato al supervisor de turno.", "Aceptar su criterio porque tiene más experiencia y anotar la observación para el reporte de fin de turno.", "Tomar una foto de la guarda suelta y enviarla al grupo de WhatsApp del área para que alguien la atienda.", "Intentar ajustar tú mismo la guarda con la faja en movimiento para no interrumpir la producción."], "best": 0, "worst": 3, "explanation": "La mejor aplica la autoridad para detener trabajo inseguro y el reporte inmediato: un atrapamiento en faja es un riesgo fatal (Fatal Risk Management) y ningún trabajo es tan urgente que no se pueda hacer de forma segura. La peor expone tu vida al intervenir un equipo en movimiento sin bloqueo (LOTO); posponer el reporte o delegarlo informalmente tampoco controla el riesgo."}, {"id": "s02", "area": "competencias", "subtype": "sjt", "competencia": "Seguridad", "prompt": "Tu jefe de área necesita que un lote de muestras llegue al laboratorio antes de las 17:00. Para llegar a tiempo tendrías que cruzar una vía de acarreo por un punto no autorizado, ahorrando 15 minutos. Son las 16:40.", "options": ["Pedir a un conductor de camioneta que te lleve por la vía de acarreo sin informar al despacho.", "Usar la ruta peatonal autorizada y avisar al jefe y al laboratorio que llegarás unos minutos tarde.", "Cruzar por el punto no autorizado con mucho cuidado, verificando que no vengan camiones.", "Esperar al día siguiente para entregar las muestras y no decir nada para evitar problemas."], "best": 1, "worst": 2, "explanation": "La mejor respeta los controles (rutas segregadas peatón-equipo pesado) y comunica el retraso: la producción no justifica asumir un riesgo de interacción con equipos pesados, que es un riesgo fatal. La peor es cruzar por un punto no autorizado: \"con cuidado\" no es un control. Ocultar el retraso también falla en Compromiso, pero no te expone a la muerte."}, {"id": "s03", "area": "competencias", "subtype": "sjt", "competencia": "Seguridad", "prompt": "Al inicio de la guardia, en la charla de 5 minutos, notas que un compañero tiene aliento a alcohol y se muestra somnoliento. Él va a operar un montacargas hoy.", "options": ["Comentarlo con otros compañeros para ver si ellos también lo notaron antes de hacer algo.", "No decir nada porque no estás seguro y podrías perjudicarlo.", "Informar de manera discreta y respetuosa al supervisor para que evalúe si está apto para trabajar (fit for duty).", "Hablar en privado con él y sugerirle que tome un café antes de empezar."], "best": 2, "worst": 1, "explanation": "Ser apto para el trabajo es una responsabilidad compartida; el supervisor tiene el procedimiento para evaluarlo sin juzgarlo públicamente. Lo peor es callar: si opera el montacargas en ese estado puede causar una fatalidad. Comentarlo con otros genera rumores y no controla el riesgo; el café no resuelve la falta de aptitud."}, {"id": "s04", "area": "competencias", "subtype": "sjt", "competencia": "Seguridad", "prompt": "Mientras caminas por el taller tropiezas con una manguera mal ubicada y te tuerces levemente el tobillo. No hay lesión visible y te sientes capaz de seguir. Es tu segunda semana de prácticas y temes dar una mala imagen.", "options": ["Contárselo a un compañero de confianza para que quede registro informal.", "Reubicar la manguera para que nadie más se tropiece y no reportar nada porque fue algo menor.", "Seguir trabajando y reportarlo solo si mañana el dolor aumenta.", "Reportar el incidente de inmediato al supervisor y acudir al tópico para evaluación, mencionando la manguera como condición insegura."], "best": 3, "worst": 2, "explanation": "La cultura de Cerro Verde exige reporte inmediato de todo incidente, incluso menor: permite atención médica oportuna y corregir la condición (orden y limpieza) antes de que cause algo grave. No hay represalias por reportar. Lo peor es esperar: oculta el incidente, puede agravar la lesión y deja el peligro sin investigar. Reubicar la manguera ayuda, pero sin reporte se pierde el aprendizaje."}, {"id": "s05", "area": "competencias", "subtype": "sjt", "competencia": "Seguridad", "prompt": "Un compañero becario con quien te llevas muy bien suele quitarse los lentes de seguridad en la zona de chancado porque \"se empañan\". Ya lo has visto hacerlo tres veces.", "options": ["Hablar con él en el momento, recordarle el riesgo de proyección de partículas y sugerirle solicitar lentes antiempañantes; si persiste, informar al supervisor.", "Ponerte también sin lentes para demostrarle solidaridad mientras buscan una solución juntos.", "No intervenir; es adulto y responsable de su propia seguridad.", "Reportarlo directamente a Recursos Humanos para que lo sancionen."], "best": 0, "worst": 1, "explanation": "La mejor combina cuidado activo por el compañero (\"soy guardián de mi hermano\"), solución a la causa raíz (EPP adecuado) y escalamiento si persiste. La peor duplica la exposición al riesgo. No intervenir normaliza el incumplimiento; ir directo a RR. HH. salta el diálogo y el canal operativo (supervisor)."}, {"id": "s06", "area": "competencias", "subtype": "sjt", "competencia": "Integridad", "prompt": "Un proveedor de repuestos con quien coordinas cotizaciones te ofrece entradas VIP para un concierto en Lima \"como agradecimiento por tu apoyo\". Tu área está evaluando su propuesta.", "options": ["Aceptarlas porque no tienen relación directa con la decisión de compra y no tienes poder de aprobación.", "Agradecer y rechazar cortésmente, explicando la política de regalos, e informar a tu supervisor del ofrecimiento.", "Pedirle que, en lugar de entradas, haga una donación a la comunidad de tu parte.", "Aceptarlas y regalarlas a un compañero para no quedar mal con el proveedor."], "best": 1, "worst": 0, "explanation": "Los Principios de Conducta Empresarial prohíben aceptar regalos que puedan influir o aparentar influir en una decisión, sobre todo durante una evaluación de proveedores. Rechazar y transparentarlo protege a ti y a la empresa. Lo peor es aceptar: genera conflicto de interés aunque no apruebes la compra. Regalarlas no elimina el beneficio recibido; pedir una donación \"de tu parte\" mezcla relaciones comerciales y comunitarias."}, {"id": "s07", "area": "competencias", "subtype": "sjt", "competencia": "Integridad", "prompt": "Preparando el reporte semanal de indicadores, descubres que en la versión que ya enviaste a la gerencia un error tuyo de fórmula infló la recuperación metalúrgica en 1,5 puntos. Nadie se ha dado cuenta.", "options": ["Pedir a un compañero que revise el archivo para ver si confirma que fue un error tuyo antes de decir algo.", "Corregir el archivo en silencio para las siguientes semanas.", "Informar a tu supervisor de inmediato, enviar la versión corregida y explicar qué controles aplicarás para que no se repita.", "Esperar a ver si alguien pregunta y entonces explicar el error."], "best": 2, "worst": 1, "explanation": "Los informes veraces son un principio central: la gerencia puede tomar decisiones con datos inflados. Reconocer el error propio de inmediato muestra integridad y excelencia. Lo peor es corregirlo en silencio: los datos falsos siguen circulando y se oculta deliberadamente el problema."}, {"id": "s08", "area": "competencias", "subtype": "sjt", "competencia": "Integridad", "prompt": "Un amigo que trabaja en una empresa contratista te pide que le compartas \"solo para referencia\" el presupuesto referencial de una licitación que viste en una carpeta compartida de tu área.", "options": ["Decirle que no tienes acceso para evitar el conflicto con él.", "Compartirle solo los montos totales, sin el detalle.", "Consultar primero con otro practicante si eso está permitido.", "Negarte explicando que es información confidencial y, si insiste, comentarlo con tu supervisor."], "best": 3, "worst": 1, "explanation": "La información de licitaciones es confidencial y filtrarla favorece injustamente a un competidor (riesgo de corrupción y conflicto de interés). Lo mejor es negarse con claridad y transparentar el pedido. Lo peor es compartir aunque sea parcialmente: es una fuga real. Mentir sobre el acceso evita el problema pero no es honesto ni alerta a la empresa."}, {"id": "s09", "area": "competencias", "subtype": "sjt", "competencia": "Integridad", "prompt": "Observas que un trabajador con más antigüedad registra horas extra que no trabajó. Cuando lo mencionas en broma, te dice: \"Aquí todos lo hacen, no te metas\".", "options": ["Reportarlo por la Línea de Ética/canal de denuncias o a tu supervisor, describiendo solo los hechos observados.", "Confrontarlo frente al equipo para que todos vean que está mal.", "Ignorarlo; como becario no te corresponde fiscalizar a nadie.", "Advertirle que, si lo vuelve a hacer, lo reportarás."], "best": 0, "worst": 1, "explanation": "Los Principios de Conducta Empresarial piden reportar posibles fraudes por los canales formales, que garantizan confidencialidad y no represalias. Lo peor es exponerlo públicamente: vulnera el respeto, genera conflicto y no activa una investigación. Ignorarlo es tolerar el fraude; advertirle negocia una falta que debe reportarse."}, {"id": "s10", "area": "competencias", "subtype": "sjt", "competencia": "Respeto", "prompt": "En el comedor, un grupo de compañeros hace bromas reiteradas sobre el acento y la procedencia de una nueva técnica que viene de una comunidad de la zona. Ella se ríe, pero notas que se incomoda.", "options": ["Esperar a que ella lo reporte, porque es su decisión.", "Decir con calma que esas bromas pueden ofender, cambiar el tema y luego acercarte a ella para ofrecerle apoyo; si se repite, informar al supervisor.", "Reírte para no quedar fuera del grupo; si ella no se queja, no es un problema.", "Dejar de almorzar con ese grupo para no involucrarte."], "best": 1, "worst": 2, "explanation": "El respeto y la diversidad implican no tolerar burlas por origen o forma de hablar, aunque la persona no se queje (puede temer represalias). Intervenir con calma y escalar si persiste es lo adecuado. Lo peor es sumarte a las risas: refuerzas la discriminación. Alejarte o esperar no detiene el comportamiento."}, {"id": "s11", "area": "competencias", "subtype": "sjt", "competencia": "Respeto", "prompt": "Acompañas al equipo de Relaciones Comunitarias a una reunión en un anexo. Un poblador, molesto, acusa a la empresa de contaminar su canal de riego y se dirige a ti en voz alta.", "options": ["Retirarte de la reunión para no empeorar la situación.", "Explicarle técnicamente que la empresa cumple todos los estándares ambientales y que está equivocado.", "Escuchar con respeto, no comprometerte a nada que no te corresponde y derivar su inquietud al responsable de Relaciones Comunitarias para que quede registrada y se atienda.", "Prometerle que harás que alguien revise su canal esa misma semana para calmarlo."], "best": 2, "worst": 3, "explanation": "En relaciones comunitarias, la escucha respetuosa y el uso del mecanismo formal de quejas construyen confianza. Lo peor es prometer algo que no puedes garantizar: dañar la credibilidad con la comunidad tiene consecuencias duraderas. Contradecirlo invalida su preocupación; retirarte puede leerse como desprecio."}, {"id": "s12", "area": "competencias", "subtype": "sjt", "competencia": "Trabajo en equipo", "prompt": "En un proyecto grupal de becarios, un integrante no ha entregado su parte y faltan dos días para la presentación al gerente. Los demás proponen excluir su nombre del informe.", "options": ["Aceptar la propuesta del grupo; quien no trabaja no debe figurar.", "Hacer tú su parte durante la noche sin decirle nada para asegurar el resultado.", "Informar de inmediato al gerente que el compañero no está trabajando.", "Conversar con él para entender qué pasa, redistribuir tareas si es necesario e informar al tutor del avance real si no se resuelve."], "best": 3, "worst": 0, "explanation": "La mejor busca la causa, protege el resultado y mantiene la transparencia con el tutor. La peor excluye a alguien sin diálogo ni proceso, lo que rompe la confianza y el respeto en el equipo. Asumir su trabajo en silencio oculta el problema; escalar directo al gerente salta pasos."}, {"id": "s13", "area": "competencias", "subtype": "sjt", "competencia": "Trabajo en equipo", "prompt": "Tu equipo de mantenimiento decidió usar un método de registro de órdenes de trabajo distinto al que tú propusiste. Crees que el tuyo era mejor.", "options": ["Aplicar el método acordado, registrar evidencia de su desempeño y proponer ajustes en la siguiente reunión de mejora.", "Seguir usando tu método en tus registros para demostrar que es mejor.", "Usar el método acordado pero comentar con otros que no funcionará.", "Dejar de aportar ideas porque no te escuchan."], "best": 0, "worst": 1, "explanation": "Comprometerse con la decisión del equipo y aportar mejoras con datos es colaboración madura. La peor rompe la estandarización: registros con métodos distintos generan errores en mantenimiento. Criticar a espaldas o desconectarse también dañan al equipo, pero no comprometen directamente la información."}, {"id": "s14", "area": "competencias", "subtype": "sjt", "competencia": "Orientación a resultados", "prompt": "Te asignan actualizar el inventario de repuestos críticos en el sistema antes del viernes. El jueves descubres que hay 300 códigos con descripciones inconsistentes que te tomarían dos días adicionales corregir.", "options": ["Trabajar hasta la madrugada jueves y viernes para terminar todo sin avisar.", "Avisar hoy a tu supervisor, proponer priorizar los repuestos críticos para el viernes y un plan para corregir el resto.", "Pedir una semana más de plazo sin explicar el motivo.", "Entregar el viernes solo lo que alcanzaste, sin mencionar las inconsistencias."], "best": 1, "worst": 3, "explanation": "Orientarse a resultados es gestionar alcance, plazo y calidad con comunicación temprana. Priorizar lo crítico entrega valor y hace visible el problema. Lo peor es ocultar las inconsistencias: el equipo de mantenimiento podría confiar en datos erróneos. Trabajar sin descanso afecta tu aptitud (fit for duty) y no resuelve la falta de visibilidad."}, {"id": "s15", "area": "competencias", "subtype": "sjt", "competencia": "Orientación a resultados", "prompt": "Notas que el reporte diario de paradas de planta se arma copiando datos manualmente de tres archivos, lo que toma 2 horas diarias. Crees que podrías automatizarlo con Power Query, aunque no es tu tarea asignada.", "options": ["Desarrollar la automatización a escondidas y reemplazar el reporte sin avisar para sorprender a todos.", "Comentar a los demás que el proceso actual es ineficiente.", "Hacer un prototipo en tus tiempos disponibles, mostrarlo a tu supervisor con el ahorro estimado y validarlo con los usuarios antes de implementarlo.", "No proponerlo porque el proceso funciona y no te lo pidieron."], "best": 2, "worst": 0, "explanation": "La excelencia incluye proponer mejoras con evidencia y validarlas con los usuarios y el responsable (gestión del cambio). La peor reemplaza un reporte oficial sin control: si tiene errores, afecta decisiones de planta. Criticar sin proponer o callar no aportan valor."}, {"id": "s16", "area": "competencias", "subtype": "sjt", "competencia": "Aprendizaje", "prompt": "Te piden usar un software de modelamiento de minas que nunca has visto, y la persona que lo domina está de vacaciones dos semanas.", "options": ["Pedir a un amigo externo que lo haga por ti enviándole los archivos del proyecto.", "Intentar aprenderlo solo sin decirle a nadie que no lo conoces.", "Decir que no puedes hacer la tarea hasta que regrese.", "Buscar los manuales y cursos internos, practicar con datos de prueba, consultar a otros usuarios del área y reportar avances y dudas a tu supervisor."], "best": 3, "worst": 0, "explanation": "La disposición a aprender con recursos disponibles y transparencia sobre el avance es lo que se espera de un becario. Lo peor es enviar archivos de la empresa a un tercero: viola la confidencialidad. Ocultar que no lo conoces puede generar errores; negarte frena el trabajo."}, {"id": "s17", "area": "competencias", "subtype": "sjt", "competencia": "Aprendizaje", "prompt": "En la retroalimentación de mitad de programa, tu tutor señala que tus informes son desordenados y difíciles de seguir. Tú sentías que estaban bien.", "options": ["Agradecer, pedir ejemplos concretos y un modelo de informe, y pedirle revisar el siguiente para verificar tu mejora.", "Explicarle que en tu universidad te enseñaron otro formato y que así está correcto.", "Pedir a otro practicante que redacte tus informes.", "Aceptar el comentario sin preguntar nada y seguir igual."], "best": 0, "worst": 2, "explanation": "Recibir retroalimentación con apertura y convertirla en un plan de mejora verificable demuestra aprendizaje. La peor delega tu responsabilidad y no desarrolla la competencia (además falsea la autoría). Justificarte o aceptar sin cambiar no generan mejora."}, {"id": "s18", "area": "competencias", "subtype": "sjt", "competencia": "Comunicación", "prompt": "Un ingeniero de operaciones (cliente interno) te llama molesto porque el dashboard que mantienes muestra datos de ayer y tiene una reunión con gerencia en una hora.", "options": ["Decirle que lo revisarás y empezar a investigar sin volver a contactarlo hasta resolverlo.", "Escuchar, confirmar qué necesita para la reunión, darle un tiempo realista de solución o un respaldo alternativo (exportación manual) y luego informar la causa.", "Explicarle que el problema es de la base de datos de TI y no tuyo.", "Prometerle que estará listo en 10 minutos aunque no sabes la causa."], "best": 1, "worst": 3, "explanation": "Una buena comunicación con el cliente interno prioriza su necesidad inmediata, da expectativas realistas y ofrece alternativas. Lo peor es prometer un plazo sin base: si fallas, pierde la reunión y la confianza. Culpar a otra área o desaparecer sin actualizaciones tampoco ayudan."}, {"id": "s19", "area": "competencias", "subtype": "sjt", "competencia": "Comunicación", "prompt": "En una reunión de seguridad, el supervisor explica un nuevo procedimiento de bloqueo (LOTO) y no entiendes un paso clave. Todos parecen haberlo entendido.", "options": ["Asumir que lo entenderás cuando lo apliques en campo.", "Quedarte callado y preguntar a un compañero después.", "Preguntar en ese momento de forma concreta cuál es el paso y por qué se hace así.", "Buscar el procedimiento en internet luego."], "best": 2, "worst": 0, "explanation": "En procedimientos críticos (aislamiento de energías), entender cada paso antes de aplicarlo es obligatorio; preguntar también ayuda a otros con la misma duda. Lo peor es aprender \"en campo\": un error de bloqueo puede ser fatal. Preguntar luego a un compañero o en internet puede darte una versión incorrecta."}, {"id": "s20", "area": "competencias", "subtype": "sjt", "competencia": "Adaptabilidad", "prompt": "Por una emergencia en la planta, tu supervisor te pide dejar tu proyecto de análisis de datos y apoyar durante una semana al área de almacén en el conteo de inventario.", "options": ["Negarte porque tu proyecto tiene un plazo y es tu prioridad.", "Aceptar y seguir avanzando tu proyecto a escondidas durante el conteo.", "Aceptar pero hacer el mínimo, ya que no es parte de tu formación.", "Aceptar, entender las prioridades del almacén, informar el estado de tu proyecto y acordar cuándo retomarlo."], "best": 3, "worst": 1, "explanation": "La adaptabilidad implica responder a prioridades cambiantes cuidando la continuidad de lo propio. La peor es la menos transparente: divide tu atención, afecta la calidad del conteo y no comunica la situación real. Hacer el mínimo o negarte muestran bajo compromiso."}, {"id": "s21", "area": "competencias", "subtype": "sjt", "competencia": "Compromiso", "prompt": "Llevas tres semanas con más tareas de las que puedes completar: tu tutor, otro ingeniero y el área de capacitación te asignan trabajos sin coordinar entre ellos. Empiezas a quedarte hasta tarde y a dormir poco.", "options": ["Hacer una lista de tareas con plazos, presentarla a tu tutor y pedirle ayuda para priorizar y coordinar con los demás.", "Dejar de responder las solicitudes que no vengan de tu tutor.", "Seguir así hasta terminar el programa; es una oportunidad para demostrar tu compromiso.", "Bajar la calidad de todas las tareas para cumplir con las fechas."], "best": 0, "worst": 2, "explanation": "Comprometerse también significa gestionar la carga de forma visible y cuidar tu aptitud: la fatiga es un factor de riesgo reconocido en minería. Lo peor es normalizar el agotamiento (riesgo para tu seguridad y calidad). Ignorar solicitudes o bajar la calidad sin acordarlo dañan la confianza."}, {"id": "s22", "area": "competencias", "subtype": "sjt", "competencia": "Compromiso", "prompt": "Tu supervisor te pide subir al sistema los resultados de una inspección que hizo otro practicante, pero notas que faltan las firmas y dos ítems están en blanco. Te dice: \"Súbelo así, luego se completa; necesitamos cerrar el indicador hoy\".", "options": ["No hacer nada y esperar que tu supervisor se olvide.", "Explicar respetuosamente que el registro está incompleto, proponer contactar hoy al practicante para completarlo y, si no es posible, registrar el indicador como pendiente con la observación.", "Completar tú los ítems en blanco con lo que consideres más probable.", "Subirlo tal como está porque es una instrucción directa."], "best": 1, "worst": 2, "explanation": "Integridad y compromiso: los registros de inspección deben ser verídicos y completos; se puede buscar cerrar hoy sin falsear. Lo peor es inventar datos: es falsificación de un registro de seguridad. Subirlo incompleto cumple el pedido pero compromete la calidad del indicador; ignorarlo es evasivo."}], "personalidad": [{"id": "p01", "statement": "Cumplo mis compromisos en el plazo acordado, aunque implique organizarme con anticipación.", "trait": "responsabilidad", "pair": "P01", "reverse": false, "lie": false, "note": "Mide confiabilidad y planificación. Las mineras buscan personas que cumplan plazos de forma predecible; sé coherente entre ambas respuestas."}, {"id": "p02", "statement": "Reviso mi trabajo antes de entregarlo para detectar errores.", "trait": "responsabilidad", "pair": "P02", "reverse": false, "lie": false, "note": "Mide minuciosidad. En operaciones un error de dato o de procedimiento tiene impacto; se valora el autocontrol de calidad."}, {"id": "p03", "statement": "Detendría una tarea si considero que no se puede realizar de forma segura, aunque eso retrase la producción.", "trait": "seguridad", "pair": "P03", "reverse": false, "lie": false, "note": "Mide adhesión a la cultura de seguridad y stop-work. Es uno de los rasgos más críticos para una minera; las respuestas deben ser claras y coherentes."}, {"id": "p04", "statement": "Uso todo el equipo de protección personal requerido, incluso para trabajos cortos.", "trait": "seguridad", "pair": "P04", "reverse": false, "lie": false, "note": "Mide disciplina con el EPP. La empresa busca cumplimiento constante, sin excepciones por duración de la tarea."}, {"id": "p05", "statement": "Reporto los incidentes y casi accidentes, aunque nadie más los haya visto.", "trait": "seguridad", "pair": "P05", "reverse": false, "lie": false, "note": "Mide cultura de reporte. Los casi accidentes son la base de la prevención; se busca a quien reporta con transparencia."}, {"id": "p06", "statement": "Disfruto colaborar con personas de distintas áreas para lograr un objetivo común.", "trait": "trabajo_en_equipo", "pair": "P06", "reverse": false, "lie": false, "note": "Mide orientación colaborativa. En una mina casi todo depende de otros turnos y áreas; no se espera que odies trabajar solo, sino que valores la colaboración."}, {"id": "p07", "statement": "Ofrezco ayuda a mis compañeros cuando veo que están sobrecargados.", "trait": "trabajo_en_equipo", "pair": "P07", "reverse": false, "lie": false, "note": "Mide apoyo mutuo. Se valora el compromiso con el resultado del equipo, no solo el individual."}, {"id": "p08", "statement": "Me entusiasma aprender herramientas o tecnologías nuevas.", "trait": "apertura_aprendizaje", "pair": "P08", "reverse": false, "lie": false, "note": "Mide disposición al aprendizaje. En un programa de becarios es clave; ser coherente no implica rechazar lo conocido, sino mostrar apertura."}, {"id": "p09", "statement": "Pido retroalimentación sobre mi desempeño para mejorar.", "trait": "apertura_aprendizaje", "pair": "P09", "reverse": false, "lie": false, "note": "Mide receptividad al feedback. Se busca alguien que use la retroalimentación para crecer."}, {"id": "p10", "statement": "Mantengo la calma cuando surgen problemas inesperados en el trabajo.", "trait": "estabilidad_emocional", "pair": "P10", "reverse": false, "lie": false, "note": "Mide manejo de la presión. En operaciones con turnos, emergencias y metas exigentes se valora la serenidad para decidir bien."}, {"id": "p11", "statement": "Puedo trabajar bajo presión sin que eso afecte mi rendimiento.", "trait": "estabilidad_emocional", "pair": "P11", "reverse": false, "lie": false, "note": "Mide tolerancia al estrés. Responde según tu realidad: la coherencia entre ambas es lo que se evalúa."}, {"id": "p12", "statement": "Digo la verdad aunque me traiga consecuencias negativas.", "trait": "integridad", "pair": "P12", "reverse": false, "lie": false, "note": "Mide honestidad, alineada con los Principios de Conducta Empresarial (informes veraces, reconocer errores)."}, {"id": "p13", "statement": "Rechazaría un regalo de un proveedor si pudiera parecer que influye en mi trabajo.", "trait": "integridad", "pair": "P13", "reverse": false, "lie": false, "note": "Mide criterio frente a conflictos de interés y anticorrupción, muy sensibles en la industria minera."}, {"id": "p14", "statement": "Me fijo metas exigentes y trabajo con constancia para alcanzarlas.", "trait": "orientacion_resultados", "pair": "P14", "reverse": false, "lie": false, "note": "Mide motivación de logro. Se busca alguien que aspire a la excelencia, siempre sin sacrificar la seguridad."}, {"id": "p15", "statement": "Busco formas de hacer mi trabajo más eficiente.", "trait": "orientacion_resultados", "pair": "P15", "reverse": false, "lie": false, "note": "Mide mejora continua. Las mineras valoran propuestas de innovación con datos y validadas."}, {"id": "p16", "statement": "Me adapto con facilidad a cambios de horario, de tareas o de lugar de trabajo.", "trait": "adaptabilidad", "pair": "P16", "reverse": false, "lie": false, "note": "Mide flexibilidad. En operación minera hay turnos, campamento y prioridades cambiantes."}, {"id": "p17", "statement": "Cuando no entiendo una instrucción, pregunto hasta tenerla clara.", "trait": "comunicacion", "pair": "P17", "reverse": false, "lie": false, "note": "Mide comunicación asertiva. En seguridad, preguntar a tiempo evita errores graves."}, {"id": "p18", "statement": "Nunca he dicho una mentira, ni siquiera pequeña.", "trait": "deseabilidad_social", "pair": "P18", "reverse": false, "lie": true, "note": "Escala de deseabilidad social (\"mentira\"). Responder 5 a la directa o 1 a la invertida sugiere que intentas dar una imagen perfecta; lo creíble es admitir imperfecciones normales."}, {"id": "p19", "statement": "Jamás me he molestado con nadie.", "trait": "deseabilidad_social", "pair": "P19", "reverse": false, "lie": true, "note": "Escala de deseabilidad social. Todos nos molestamos alguna vez; negarlo por completo resta credibilidad al resto del perfil."}, {"id": "p20", "statement": "Siempre cumplo absolutamente todas las normas, sin excepción, en todos los ámbitos de mi vida.", "trait": "deseabilidad_social", "pair": "P20", "reverse": false, "lie": true, "note": "Escala de deseabilidad social. Se espera responsabilidad, no perfección absoluta; las respuestas extremas levantan sospecha de falta de sinceridad."}, {"id": "p21", "statement": "Cuando tengo mucha carga de trabajo me bloqueo y no sé por dónde empezar.", "trait": "estabilidad_emocional", "pair": "P11", "reverse": true, "lie": false, "note": "Mide tolerancia al estrés. Responde según tu realidad: la coherencia entre ambas es lo que se evalúa."}, {"id": "p22", "statement": "A veces es justificable ocultar un error si nadie resulta afectado.", "trait": "integridad", "pair": "P12", "reverse": true, "lie": false, "note": "Mide honestidad, alineada con los Principios de Conducta Empresarial (informes veraces, reconocer errores)."}, {"id": "p23", "statement": "Aceptar pequeños favores de proveedores es normal y no afecta las decisiones.", "trait": "integridad", "pair": "P13", "reverse": true, "lie": false, "note": "Mide criterio frente a conflictos de interés y anticorrupción, muy sensibles en la industria minera."}, {"id": "p24", "statement": "Me conformo con cumplir lo mínimo que se me pide.", "trait": "orientacion_resultados", "pair": "P14", "reverse": true, "lie": false, "note": "Mide motivación de logro. Se busca alguien que aspire a la excelencia, siempre sin sacrificar la seguridad."}, {"id": "p25", "statement": "Si algo funciona, no veo necesidad de mejorarlo.", "trait": "orientacion_resultados", "pair": "P15", "reverse": true, "lie": false, "note": "Mide mejora continua. Las mineras valoran propuestas de innovación con datos y validadas."}, {"id": "p26", "statement": "Me cuesta mucho trabajar cuando cambian los planes a último momento.", "trait": "adaptabilidad", "pair": "P16", "reverse": true, "lie": false, "note": "Mide flexibilidad. En operación minera hay turnos, campamento y prioridades cambiantes."}, {"id": "p27", "statement": "Prefiero no hacer preguntas para no parecer que no sé.", "trait": "comunicacion", "pair": "P17", "reverse": true, "lie": false, "note": "Mide comunicación asertiva. En seguridad, preguntar a tiempo evita errores graves."}, {"id": "p28", "statement": "Alguna vez he exagerado algo para quedar bien.", "trait": "deseabilidad_social", "pair": "P18", "reverse": true, "lie": true, "note": "Escala de deseabilidad social (\"mentira\"). Responder 5 a la directa o 1 a la invertida sugiere que intentas dar una imagen perfecta; lo creíble es admitir imperfecciones normales."}, {"id": "p29", "statement": "En ocasiones me he sentido irritado con alguna persona.", "trait": "deseabilidad_social", "pair": "P19", "reverse": true, "lie": true, "note": "Escala de deseabilidad social. Todos nos molestamos alguna vez; negarlo por completo resta credibilidad al resto del perfil."}, {"id": "p30", "statement": "Alguna vez he llegado tarde o he olvidado algo que debía hacer.", "trait": "deseabilidad_social", "pair": "P20", "reverse": true, "lie": true, "note": "Escala de deseabilidad social. Se espera responsabilidad, no perfección absoluta; las respuestas extremas levantan sospecha de falta de sinceridad."}, {"id": "p31", "statement": "Con frecuencia dejo las tareas para el último momento.", "trait": "responsabilidad", "pair": "P01", "reverse": true, "lie": false, "note": "Mide confiabilidad y planificación. Las mineras buscan personas que cumplan plazos de forma predecible; sé coherente entre ambas respuestas."}, {"id": "p32", "statement": "Si una tarea parece terminada, prefiero entregarla sin revisarla de nuevo.", "trait": "responsabilidad", "pair": "P02", "reverse": true, "lie": false, "note": "Mide minuciosidad. En operaciones un error de dato o de procedimiento tiene impacto; se valora el autocontrol de calidad."}, {"id": "p33", "statement": "Cuando hay presión por cumplir la meta, es aceptable saltarse algún paso del p dad al feedback. Se busca alguien que use la retroalimentación para crecer."}, {"id": "p40", "statement": "Me altero con facilidad cuando las cosas no salen como lo planeé.", "trait": "estabilidad_emocional", "pair": "P10", "reverse": true, "lie": false, "note": "Mide manejo de la presión. En operaciones con turnos, emergencias y metas exigentes se valora la serenidad para decidir bien."}]}, "parentesco": [{"id": "pa01", "area": "logico", "subtype": "parentesco", "difficulty": "facil", "prompt": "La única hermana de mi padre tiene un hijo. ¿Qué es ese hijo para mí?", "options": ["Sobrino", "Primo", "Hermano", "Tío"], "answer": 1, "explanation": "La hermana de mi padre es mi tía. El hijo de mi tía es mi primo."}, {"id": "pa02", "area": "logico", "subtype": "parentesco", "difficulty": "facil", "prompt": "Mi hermano tiene un hijo. ¿Qué es para mí el padre de ese niño?", "options": ["Mi tío", "Mi padre", "Mi hermano", "Mi primo"], "answer": 2, "explanation": "El padre del hijo de mi hermano es mi propio hermano. Pregunta “circular”: solo vuelves al punto de partida."}, {"id": "pa03", "area": "logico", "subtype": "parentesco", "difficulty": "media", "prompt": "Una mujer señala a un joven y dice: “Su madre es la única hija de mi madre”. ¿Qué es el joven para la mujer?", "options": ["Hermano", "Sobrino", "Hijo", "Nieto"], "answer": 2, "explanation": "“La única hija de mi madre” es ella misma. Entonces la madre del joven es la mujer: el joven es su hijo."}, {"id": "pa04", "area": "logico", "subtype": "parentesco", "difficulty": "media", "prompt": "Un hombre mira una foto y dice: “El padre de esta persona es el hijo de mi padre, y yo no tengo hermanos”. ¿Quién es la persona de la foto?", "options": ["Él mismo", "Su hijo o hija", "Su padre", "Su sobrino"], "answer": 1, "explanation": "Como no tiene hermanos, “el hijo de mi padre” es él mismo. Entonces el padre de la persona de la foto es él: es su hijo o hija."}, {"id": "pa05", "area": "logico", "subtype": "parentesco", "difficulty": "facil", "prompt": "¿Qué parentesco tiene conmigo la hija de la hermana de mi madre?", "options": ["Prima", "Sobrina", "Tía", "Hermana"], "answer": 0, "explanation": "La hermana de mi madre es mi tía. La hija de mi tía es mi prima."}, {"id": "pa06", "area": "logico", "subtype": "parentesco", "difficulty": "media", "prompt": "Una mujer casada dice: “Él es el hermano del padre de mi hijo”. ¿Qué es él para la mujer?", "options": ["Hermano", "Cuñado", "Tío", "Suegro"], "answer": 1, "explanation": "El padre de su hijo es su esposo. El hermano de su esposo es su cuñado (y tío del niño)."}, {"id": "pa07", "area": "logico", "subtype": "parentesco", "difficulty": "media", "prompt": "Ana tiene un único hermano, que está casado. ¿Quién es para Ana la suegra de la esposa de su hermano?", "options": ["Su abuela", "Su tía", "Su suegra", "Su madre"], "answer": 3, "explanation": "La suegra de la esposa del hermano es la madre del hermano. La madre del hermano de Ana es la madre de Ana."}, {"id": "pa08", "area": "logico", "subtype": "parentesco", "difficulty": "media", "prompt": "Carlos es hijo único. ¿Qué es para Carlos el nieto del padre de Carlos?", "options": ["Su hijo", "Su sobrino", "Su primo", "Su nieto"], "answer": 0, "explanation": "Los nietos del padre de Carlos son los hijos de sus hijos. Como Carlos es hijo único, ese nieto tiene que ser hijo de Carlos."}, {"id": "pa09", "area": "logico", "subtype": "parentesco", "difficulty": "dificil", "prompt": "En una familia hay 2 padres, 2 hijos y 1 nieto. ¿Cuál es el número mínimo de personas?", "options": ["5", "4", "2", "3"], "answer": 3, "explanation": "Abuelo → padre → nieto. El abuelo y el padre son los 2 padres; el padre y el nieto son los 2 hijos; el nieto es 1. Una misma persona puede cumplir varios roles: 3 personas."}, {"id": "pa10", "area": "logico", "subtype": "parentesco", "difficulty": "media", "prompt": "Una mujer dice: “El hijo de Pedro es el padre de mi hijo”. ¿Qué es Pedro para ella?", "options": ["Su su ina", "Su nieta", "Su prima", "Su hija"], "answer": 3, "explanation": "La única hija de su suegra es su esposa. La hija de su esposa es su hija (o hijastra; entre estas opciones, hija)."}]};

const APT = []; let SJT = [], PERS = [];
(function load(){
  if(!BANK) return;
  for(const k of ["verbal_ingles","numerico_logico","espacial","parentesco"]) (BANK[k]||[]).forEach(q=>APT.push(q));

/* ---------- storage ---------- */
const store = {
  get(k,d){ try{ const v = localStorage.getItem("smcv:"+k); return v==null? d : JSON.parse(v);}catch(e){return d} },
  set(k,v){ try{ localStorage.setItem("smcv:"+k, JSON.stringify(v)); }catch(e){} }
};
function recordAnswer(q, ok){
  const st = store.get("stats",{}); const a = st[q.area]||{c:0,t:0}; a.t++; if(ok) a.c++; st[q.area]=a; store.set("stats",st);
  let errs = store.get("errors",[]);
  if(ok) errs = errs.filter(id=>id!==q.id); else if(!errs.includes(q.id)) errs.push(q.id);
  store.set("errors",errs);
}

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const isSvg = s=>/^\s*<svg/i.test(s||"");
const L = "ABCDE";
const fmt = s=>{ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0"); };
function wrapTables(html){ return html.replace(/<table/g,'<div class="tablebox"><table').replace(/<\/table>/g,'</table></div>'); }
function subLabel(s){ return String(s||"").replace(/_/g," "); }

/* ---------- countdown ---------- */
const DEADLINES = [
  {label:"Competencias cierra", at:new Date("2026-10-10T23:55:00-05:00")},
  {label:"Aptitudes (Webex)", at:new Date("2026-10-11T13:30:00-05:00")}
];
function tickClocks(){
  const now = Date.now();
  $("#clocks").innerHTML = DEADLINES.map(d=>{
    const ms = d.at - now; let txt;
    if(ms<=0) txt="ya pasó";
    else { const h=Math.floor(ms/36e5), m=Math.floor(ms%36e5/6e4); txt = (h>=24? Math.floor(h/24)+"d "+(h%24)+"h ": h+"h ") + m+"m"; }
    return `<div class="clock ${ms>0&&ms<36e5*24?"urgent":""}"><small>${d.label}</small><span class="mono">${txt}</span></div>`;
  }).join("");
}
tickClocks(); setInterval(tickClocks, 30000);

/* ---------- tabs ---------- */
let TAB = store.get("tab","inicio");
let EXAM = null; // active quiz
function go(tab){
  if(EXAM && EXAM.mode==="simulacro" && !EXAM.done && tab!=="simulacro"){ /* keep exam running but allow navigation */ }
  TAB = tab; store.set("tab",tab);
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===tab?"page":"false"));
  render(); window.scrollTo({top:0});
}
document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(b) go(b.dataset.tab); });

function render(){
  const v = $("#view");
  if(TAB==="inicio") v.innerHTML = viewInicio();
  else if(TAB==="practica") v.innerHTML = (EXAM && EXAM.mode==="practica") ? viewExam() : viewPracticaConfig();
  else if(TAB==="simulacro") v.innerHTML = (EXAM && EXAM.mode==="simulacro") ? viewExam() : viewSimConfig();
  else if(TAB==="competencias") v.innerHTML = viewComp();
  else if(TAB==="guia") v.innerHTML = viewGuia();
  if(TAB==="guia") setupBreath();
}

/* ---------- exam engine ---------- */
let timerId = null;
function startExam(mode, items, limitSec, label){
  EXAM = {mode, items, idx:0, ans:Array(items.length).fill(null), marked:new Set(), start:Date.now(), limit:limitSec, label, done:false, blur:0, confirm:false};
  clearInterval(timerId);
  if(limitSec){ timerId = setInterval(()=>{ if(!EXAM||EXAM.done){clearInterval(timerId);return;} const left = EXAM.limit-(Date.now()-EXAM.start)/1000; const t=$("#timer"); if(t){t.textContent=fmt(left); t.classList.toggle("low",left<120);} const p=$("#pace"); if(p) p.textContent=paceText(); if(left<=0) finishExam(); },1000); }
  render(); window.scrollTo({top:0});
}
function paceText(){
  if(!EXAM||!EXAM.limit) return "";
  const used=(Date.now()-EXAM.start)/1000, answered=EXAM.ans.filter(a=>a!=null).length;
  const target = EXAM.limit/EXAM.items.length*answered;
  if(answered===0) return "Ritmo: empieza tranquilo";
  return used>target+30? "Vas lento: salta lo difícil y vuelve después" : "Ritmo: bien";
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden && EXAM && EXAM.mode==="simulacro" && !EXAM.done) EXAM.blur++; });

function optHtml(q,i,cls,disabled){
  const o=q.options[i]; const svg=isSvg(o);
  return `<button class="opt ${cls}" data-opt="${i}" ${disabled?"disabled":""}><span class="key">${L[i]}</span><span class="body">${svg?o:o}</span></button>`;
}
function viewExam(){
  const E=EXAM; if(E.done) return viewResults();
  const q=E.items[E.idx]; const a=E.ans[E.idx]; const prac=E.mode==="practica";
  const figs = q.options.some(isSvg);
  let opts="";
  q.options.forEach((o,i)=>{
    let cls=""; if(prac && a!=null){ if(i===q.answer) cls="right"; else if(i===a) cls="wrong"; } else if(a===i) cls="sel";
    opts+=optHtml(q,i,cls, prac && a!=null);
  });
  const left = E.limit? E.limit-(Date.now()-E.start)/1000 : 0;
  const head = `<div class="qhead"><div class="row" style="gap:8px"><span class="chip acc">${AREAS[q.area].n}</span><span class="chip">${esc(subLabel(q.subtype))}</span>${q.difficulty?`<span class="chip">${esc(q.difficulty)}</span>`:""}</div>
    <div class="row">${E.limit?`<span class="timer ${left<120?"low":""}" id="timer">${fmt(left)}</span>`:""}<span class="mono muted">${E.idx+1} / ${E.items.length}</span></div></div>`;
  const fb = prac && a!=null ? `<div class="expl ${a===q.answer?"":"bad"}"><b>${a===q.answer?"Correcto.":"Incorrecto. La respuesta es "+L[q.answer]+"."}</b> ${q.explanation||""}</div>`:"";
  const last = E.idx===E.items.length-1;
  const foot = prac
    ? `<div class="qfoot"><button class="btn ghost" data-action="quit">Salir</button><button class="btn primary" data-action="${last?"finish":"next"}" ${a==null?"disabled":""}>${last?"Ver resultado":"Siguiente"}</button></div>`
    : `<div class="qfoot"><div class="row"><button class="btn" data-action="prev" ${E.idx===0?"disabled":""}>Anterior</button><button class="btn" data-action="mark">${E.marked.has(E.idx)?"Quitar marca":"Marcar para revisar"}</button></div><button class="btn primary" data-action="next">${last?"Ir al resumen":"Siguiente"}</button></div>`;
  const card = `<section class="panel"><div>${head}</div><div class="qtext">${wrapTables(q.prompt)}${q.figure?`<div class="figure">${q.figure}</div>`:""}</div>
    <div class="opts ${figs?"figs":""}">${opts}</div>${fb}${foot}</section>`;
  if(prac) return `<div class="stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(E.label)}</span><span class="muted mono">${E.ans.filter((x,i)=>x!=null&&x===E.items[i].answer).length} correctas</span></div>${card}</div>`;
  const answered = E.ans.filter(x=>x!=null).length;
  const side = `<aside class="panel stack" style="padding:16px"><div><span class="eyebrow">Navegador</span><p class="pace" id="pace">${paceText()}</p></div>
    <div class="navgrid">${E.items.map((_,i)=>`<button data-jump="${i}" class="${i===E.idx?"cur":""} ${E.ans[i]!=null?"ans":""} ${E.marked.has(i)?"mark":""}">${i+1}</button>`).join("")}</div>
    <div class="legend"><span>${answered} de ${E.items.length} respondidas</span><span>Subrayado cobre: marcada para revisar</span></div>
    <button class="btn" data-action="ask-finish">Terminar examen</button>
    ${E.confirm?`<div class="confirm"><span>${E.items.length-answered? `Te faltan ${E.items.length-answered} preguntas sin responder.`:"Respondiste todo."} ¿Entregar ahora?</span><div class="row"><button class="btn primary small" data-action="finish">Sí, entregar</button><button class="btn small" data-action="cancel-finish">Seguir</button></div></div>`:""}
  </aside>`;
  return `<div class="stack"><span class="eyebrow">${esc(E.label)}</span><div class="exam">${card}${side}</div></div>`;
}
function finishExam(){
  const E=EXAM; if(!E||E.done) return;
  E.done=true; E.used=Math.min(E.limit||1e9,(Date.now()-E.start)/1000); clearInterval(timerId);
  if(E.mode==="simulacro"){ E.items.forEach((q,i)=>{ if(E.ans[i]!=null) recordAnswer(q,E.ans[i]===q.answer); else recordAnswer(q,false); });
    const h=store.get("simhist",[]); const c=E.items.filter((q,i)=>E.ans[i]===q.answer).length;
    h.push({date:new Date().toLocaleString("es-PE",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}), type:E.label.replace("Simulacro ",""), c, t:E.items.length, used:E.used}); store.set("simhist",h); }
  render(); window.scrollTo({top:0});
}
function viewResults(){
  const E=EXAM; const c=E.items.filter((q,i)=>E.ans[i]===q.answer).length; const pct=Math.round(c/E.items.length*100);
  const by={}; E.items.forEach((q,i)=>{ const b=by[q.area]||(by[q.area]={c:0,t:0,blank:0}); b.t++; if(E.ans[i]===q.answer) b.c++; if(E.ans[i]==null) b.blank++; });
  const msg = pct>=80?"Muy bien. Mantén el ritmo y repasa solo tus errores.":pct>=60?"Vas bien. Enfócate en las áreas en cobre.":"Normal al empezar. Usa el modo práctica en las áreas más bajas y repite el simulacro.";
  const rows = Object.entries(by).map(([a,b])=>{const p=Math.round(b.c/b.t*100); return `<tr><td>${AREAS[a].n}</td><td class="n mono">${b.c}/${b.t}</td><td class="n"><span class="chip ${p>=70?"good":p>=50?"warn":"bad"}">${p}%</span></td><td class="n mono muted">${b.blank||""}</td></tr>`;}).join("");
  const rev = E.items.map((q,i)=>{ const a=E.ans[i], ok=a===q.answer;
    return `<details class="rev"><summary><span class="chip ${ok?"good":a==null?"warn":"bad"}">${i+1} · ${ok?"bien":a==null?"en blanco":"mal"}</span><span class="muted">${AREAS[q.area].n} · ${esc(subLabel(q.subtype))}</span></summary>
      <div class="qtext" style="margin-top:10px">${wrapTables(q.prompt)}${q.figure?`<div class="figure">${q.figure}</div>`:""}</div>
      <div class="opts ${q.options.some(isSvg)?"figs":""}">${q.options.map((o,j)=>optHtml(q,j, j===q.answer?"right":(j===a?"wrong":""), true)).join("")}</div>
      <div class="expl">${q.explanation||""}</div></details>`; }).join("");
  return `<div class="stack">
    <section class="panel stack"><span class="eyebrow">${esc(E.label)} · resultado</span>
      <div class="score"><span class="big mono">${c}/${E.items.length}</span><div><b style="font-size:1.3rem">${pct}%</b><p class="muted">${E.limit?"Tiempo usado "+fmt(E.used)+" de "+fmt(E.limit):""}${E.mode==="simulacro"?` · Salidas de la pestaña: <b style="color:${E.blur?"var(--bad)":"var(--good)"}">${E.blur}</b>`:""}</p></div></div>
      <p>${msg}</p>
      <div style="overflow-x:auto"><table class="tbl"><tr><th>Área</th><th class="n">Aciertos</th><th class="n">%</th><th class="n">En blanco</th></tr>${rows}</table></div>
      <div class="row"><button class="btn primary" data-action="again">${E.mode==="simulacro"?"Otro simulacro":"Practicar de nuevo"}</button><button class="btn" data-action="quit">Volver</button></div>
    </section>
    <div class="stack" style="gap:8px"><span class="eyebrow">Revisión pregunta por pregunta</span>${rev}</div>
  </div>`;
}

function viewSJT(){
  const S=COMP; if(S.i>=S.items.length) return viewSJTRes();
  const q=S.items[S.i]; const st=S.st[S.i];
  const phase = st.best==null? "best" : st.worst==null? "worst" : "done";
  const opts = q.options.map((o,j)=>{ let cls="", lab="";
    if(phase==="done"){ if(j===q.best){cls="right"; lab=" <span class='chip good'>mejor</span>";} else if(j===q.worst){cls="wrong"; lab=" <span class='chip bad'>peor</span>";}
      if(j===st.best && j!==q.best) lab+=" <span class='chip'>tu mejor</span>"; if(j===st.worst && j!==q.worst) lab+=" <span class='chip'>tu peor</span>"; }

    const dis = phase==="done" || (phase==="worst" && j===st.best);
    return `<button class="opt ${cls}" data-sjt="${j}" ${dis?"disabled":""}><span class="key">${L[j]}</span><span class="body">${esc(o)}${lab}</span></button>`;}).join("");
  const res = phase==="done"? `<div class="expl"><b>${(st.best===q.best?1:0)+(st.worst===q.worst?1:0)}/2.</b> ${esc(q.explanation)}</div>`:"";

}
function viewSJTRes(){

const LIK = ["Totalmente en desacuerdo","En desacuerdo","Ni de acuerdo ni en desacuerdo","De acuerdo","Totalmente de acuerdo"];
function viewPers(){
  const P=COMP; const per=10; const start=P.page*per; const items=P.items.slice(start,start+per);
  const pages=Math.ceil(P.items.length/per); const pageDone=items.every(it=>P.ans[it.id]);
  return `<div class="stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">Cuestionario · página ${P.page+1} de ${pages}</span><span class="mono muted">${Object.keys(P.ans).length}/${P.items.length}</span></div>
  <section class="panel">${items.map(it=>`<div class="lik"><p style="font-weight:600">${esc(it.statement)}</p><div class="scale">${LIK.map((t,v)=>`<button data-lik="${esc(it.id)}" data-v="${v+1}" aria-pressed="${P.ans[it.id]===v+1}"><b>${v+1}</b>${t}</button>`).join("")}</div></div>`).join("")}
  <div class="qfoot"><div class="row"><button class="btn ghost" data-action="comp-menu">Salir</button>${P.page>0?`<button class="btn" data-action="pers-prev">Anterior</button>`:""}</div>

}
function viewPersRes(){
  const P=COMP; const norm = it=>{ const v=P.ans[it.id]; return it.reverse? 6-v : v; };
  const pairs={}; P.items.forEach(it=>{ (pairs[it.pair]=pairs[it.pair]||[]).push(it); });
  const inc=[], lies=[];
  Object.values(pairs).forEach(ps=>{ if(ps.length===2){ const d=Math.abs(norm(ps[0])-norm(ps[1])); if(d>=2) inc.push({ps,d}); } });
  P.items.forEach(it=>{ if(it.lie && norm(it)>=5) lies.push(it); });
  const traits={}; P.items.forEach(it=>{ if(it.lie||it.trait==="deseabilidad_social") return; const t=traits[it.trait]||(traits[it.trait]={s:0,n:0}); t.s+=norm(it); t.n++; });
  const bars = Object.entries(traits).map(([k,t])=>{ const avg=t.s/t.n; const pct=Math.round((avg-1)/4*100);
    return `<div class="bar"><span>${esc(subLabel(k))}</span><div class="track"><div class="fill ${avg<3?"low":""}" style="width:${pct}%"></div></div><span class="mono">${avg.toFixed(1)}</span></div>`;}).join("");
  const nPairs = Object.values(pairs).filter(p=>p.length===2).length;
  const incHtml = inc.length? inc.map(({ps})=>`<div class="expl bad"><p>“${esc(ps[0].statement)}” → <b>${P.ans[ps[0].id]}</b></p><p>“${esc(ps[1].statement)}” → <b>${P.ans[ps[1].id]}</b></p><p class="muted" style="margin-top:4px">${esc(ps[0].note||ps[1].note||"")}</p></div>`).join("") : `<p class="chip good">Sin contradicciones fuertes</p>`;
  const lieHtml = lies.length? `<div class="expl bad"><b>Ojo con la deseabilidad social.</b> Respondiste el extremo en: ${lies.map(l=>"“"+esc(l.statement)+"”").join(", ")}. Nadie es perfecto; estas frases están para detectar a quien intenta verse ideal. Responder 3 o 4 es más creíble.</div>` : `<p class="chip good">Respuestas creíbles en las preguntas de control</p>`;
  return `<div class="stack"><section class="panel stack"><span class="eyebrow">Tu perfil de práctica</span>
    <div class="score"><span class="big mono">${nPairs-inc.length}/${nPairs}</span><p class="muted">pares consistentes (diferencia menor a 2 puntos entre dos preguntas que miden lo mismo)</p></div>
    <div><h3>Contradicciones</h3><div class="stack" style="gap:8px;margin-top:8px">${incHtml}</div></div>
    <div><h3>Preguntas de control</h3><div style="margin-top:8px">${lieHtml}</div></div>
    <div><h3>Rasgos (1 a 5)</h3><p class="muted" style="font-size:.9rem">Solo para que te conozcas. No hay un puntaje “aprobatorio”; lo que preocupa a un evaluador son contradicciones y respuestas imposibles.</p><div class="bars" style="margin-top:10px">${bars}</div></div>
    <div class="row"><button class="btn primary" data-action="start-pers">Repetir</button><button class="btn" data-action="comp-menu">Volver</button></div></section></div>`;
}
function persOrder(){ // separate pair members: first half gets one of each pair, second half the other
  const pairs={}; PERS.forEach(it=>{ (pairs[it.pair]=pairs[it.pair]||[]).push(it); });
  const A=[],B=[]; shuffle(Object.values(pairs)).forEach(ps=>{ const s=shuffle(ps); A.push(s[0]); if(s[1]) B.push(s[1]); s.slice(2).forEach(x=>B.push(x)); });
  return shuffle(A).concat(shuffle(B));
}

let breathTimer=null;
function setupBreath(){ clearInterval(breathTimer); }
function runBreath(){
  clearInterval(breathTimer); const steps=["Inhala","Sostén","Exhala","Sostén"]; let i=0, n=0; const lung=$("#lung"), txt=$("#breathTxt");
  const step=()=>{ if(!$("#lung")){clearInterval(breathTimer);return;} const s=steps[i%4]; lung.textContent=s; if(s==="Inhala") lung.classList.add("in"); if(s==="Exhala") lung.classList.remove("in"); txt.textContent="ciclo "+(Math.floor(i/4)+1)+" de 4"; i++; if(i>16){clearInterval(breathTimer); lung.textContent="Listo"; lung.classList.remove("in"); txt.textContent="";} };
  step(); breathTimer=setInterval(step,4000);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-plan]"); if(!t) return;
  const d=t.dataset;
  if(d.go){ go(d.go); return; }
  if(d.parea){ PCFG.area=d.parea; PCFG.sub=""; store.set("pcfg",PCFG); render(); return; }
  if(d.pn!=null && t.matches("[data-pn]")){ PCFG.n=+d.pn; store.set("pcfg",PCFG); render(); return; }
  if(d.sim){ SCFG=d.sim; store.set("scfg",SCFG); render(); return; }
  if(d.jump!=null && EXAM){ EXAM.idx=+d.jump; EXAM.confirm=false; render(); return; }
  if(d.opt!=null && EXAM && !EXAM.done){ const i=+d.opt, q=EXAM.items[EXAM.idx];
    if(EXAM.mode==="practica"){ if(EXAM.ans[EXAM.idx]!=null) return; EXAM.ans[EXAM.idx]=i; recordAnswer(q,i===q.answer); }
    else EXAM.ans[EXAM.idx]=i;
    render(); return; }
  if(d.sjt!=null){ const st=COMP.st[COMP.i]; const j=+d.sjt; if(st.best==null) st.best=j; else if(st.worst==null && j!==st.best) st.worst=j; render(); return; }
  if(d.lik){ COMP.ans[d.lik]=+d.v; const y=window.scrollY; render(); window.scrollTo({top:y}); return; }
  const A=d.action; if(!A) return;
  switch(A){
    case "start-practice": { const pool=shuffle(filterPool()); const items=PCFG.n? pool.slice(0,PCFG.n):pool; startExam("practica",items,0,"Práctica · "+AREAS[PCFG.area].n+(PCFG.sub?" · "+subLabel(PCFG.sub):"")); if(TAB!=="practica") go("practica"); break; }
    case "review-errors": { const ids=store.get("errors",[]); const items=shuffle(APT.filter(q=>ids.includes(q.id))); if(!items.length) return; TAB="practica"; store.set("tab",TAB); document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===TAB?"page":"false")); startExam("practica",items,0,"Repaso de mis errores"); break; }
    case "start-sim": { const s=SIMS[SCFG]; let items=[]; for(const [a,n] of Object.entries(s.mix)) items=items.concat(shuffle(APT.filter(q=>q.area===a)).slice(0,n)); startExam("simulacro",shuffle(items),s.min*60,"Simulacro "+s.n.toLowerCase()); break; }
    case "next": if(EXAM.idx<EXAM.items.length-1){EXAM.idx++; EXAM.confirm=false; render(); window.scrollTo({top:0});} else if(EXAM.mode==="practica") finishExam(); else {EXAM.confirm=true; render();} break;
    case "prev": if(EXAM.idx>0){EXAM.idx--; render();} break;
    case "mark": EXAM.marked.has(EXAM.idx)?EXAM.marked.delete(EXAM.idx):EXAM.marked.add(EXAM.idx); render(); break;
    case "ask-finish": EXAM.confirm=true; render(); break;
    case "cancel-finish": EXAM.confirm=false; render(); break;
    case "finish": finishExam(); break;
    case "quit": clearInterval(timerId); EXAM=null; render(); break;
    case "again": { const m=EXAM.mode; EXAM=null; if(m==="simulacro"){ render(); } else render(); break; }
    case "reset-stats": { const c=$("#resetConfirm"); c.innerHTML=`<button class="btn small" data-action="reset-yes">Sí, borrar</button>`; break; }
    case "reset-yes": store.set("stats",{}); store.set("errors",[]); store.set("simhist",[]); render(); break;
    case "start-sjt": COMP={view:"sjt", items:shuffle(SJT), i:0, st:SJT.map(()=>({best:null,worst:null}))}; render(); window.scrollTo({top:0}); break;
    case "sjt-next": COMP.i++; render(); window.scrollTo({top:0}); break;
    case "start-pers": COMP={view:"pers", items:persOrder(), page:0, ans:{}}; render(); window.scrollTo({top:0}); break;
    case "pers-next": COMP.page++; render(); window.scrollTo({top:0}); break;
    case "pers-prev": COMP.page--; render(); window.scrollTo({top:0}); break;
    case "pers-finish": COMP.view="persres"; render(); window.scrollTo({top:0}); break;
    case "comp-menu": COMP={view:"menu"}; render(); window.scrollTo({top:0}); break;
    case "breath": runBreath(); break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.plan){ const p=store.get("plan",{}); p[t.dataset.plan]=t.checked; store.set("plan",p); t.closest(".check").classList.toggle("done",t.checked); }
  if(t.dataset.pre){ PRECHECK[t.dataset.pre]=t.checked; t.closest(".check").classList.toggle("done",t.checked); }
  if(t.id==="psub"){ PCFG.sub=t.value; store.set("pcfg",PCFG); render(); }
  if(t.id==="pdiff"){ PCFG.diff=t.value; store.set("pcfg",PCFG); render(); }
});
document.addEventListener("keydown",e=>{
  if(!EXAM||EXAM.done) return; if(!["practica","simulacro"].includes(TAB)) return;
  if(e.target.matches("input,select,textarea")) return;
  const n=parseInt(e.key,10);
  if(n>=1 && n<=EXAM.items[EXAM.idx].options.length){ const b=document.querySelector(`[data-opt="${n-1}"]`); if(b&&!b.disabled) b.click(); }
  else if(e.key==="Enter"){ const b=document.querySelector('[data-action="next"],[data-action="finish"]'); if(b&&!b.disabled){ e.preventDefault(); b.click(); } }
});

go(TAB);
